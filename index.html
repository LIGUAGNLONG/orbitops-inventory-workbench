<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrbitOps运营数据工作台｜库存监控</title>
<style>
:root{--bg:#eef2f7;--panel:#ffffff;--line:#d9e1ec;--text:#182335;--muted:#6b7788;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--shadow:0 14px 40px rgba(15,23,42,.12)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f8fbff,#edf3fb 42%,#eef7ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.app{height:100vh;display:grid;grid-template-columns:112px 1fr;overflow:hidden}.rail{background:#162033;color:white;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}.logo{width:92px;min-height:58px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:800;box-shadow:0 10px 26px rgba(37,99,235,.35);line-height:1}.logo .menu-icon{font-size:22px}.logo small{font-size:12px;font-weight:800;letter-spacing:.08em}.nav{width:92px;min-height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#cbd5e1;border:0;background:transparent;font-size:20px;cursor:pointer;text-decoration:none;line-height:1}.nav:hover{background:rgba(255,255,255,.08);color:white}.nav.active{background:rgba(255,255,255,.16);color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}.nav small{position:static;background:transparent;color:inherit;padding:0;border-radius:0;font-size:12px;font-weight:700;display:block;white-space:nowrap;letter-spacing:.02em}.nav:hover small{display:block}.main{display:grid;grid-template-rows:64px 1fr;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(14px)}.title{font-size:18px;font-weight:800}.crumb{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:10px;align-items:center}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#ecfdf5;color:#047857;border:1px solid #bbf7d0}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px;color:#334155;text-decoration:none;font-size:13px}.content{padding:16px;min-height:0}.frame-card{height:100%;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden;display:block}.frame-head{display:none}.dots,.dot{display:none}iframe{width:100%;height:100%;border:0;background:white}.warn{color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:5px 9px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo"><span class="menu-icon">☰</span><small>菜单</small></div>
    <button class="nav active" data-src="dashboard.html" data-title="库存监控看板" data-crumb="飞书工作台 / 运营看板 / 库存监控 · FBA仓库存 + 海外仓库存">📊<small>库存监控</small></button>
    <button class="nav" data-src="fba_age_dashboard.html" data-title="在库库龄" data-crumb="飞书工作台 / 运营看板 / 在库库龄 · FBA库龄成本 + 数量">📦<small>在库库龄</small></button>
    <button class="nav" data-src="shipping_plan_dashboard.html" data-title="出货计划" data-crumb="飞书工作台 / 运营看板 / 出货计划 · 产品等级 × 预测开始日期 × 数量">🚚<small>出货计划</small></button>
    <button class="nav" data-src="forecast_dashboard.html" data-title="需求预测" data-crumb="需求预测：读取 04_需求计划 最新预测数据，基础预测 / LightGBM / CatBoost / 人工预测对比">📈<small>需求预测</small></button>
  </aside>
  <main class="main">
    <header class="top">
      <div><div class="title" id="pageTitle">OrbitOps运营数据工作台｜库存监控</div><div class="crumb" id="pageCrumb">飞书工作台 / 运营看板 / 库存监控 · FBA仓库存 + 海外仓库存</div></div>
      <div class="actions"><span class="pill">FBA仓库存 + 海外仓库存</span><span class="pill">FBA库龄：数量 + 成本</span><a class="btn" id="openNew" href="dashboard.html?v=20260810_hide_sku_detail" target="_blank">新窗口打开当前模块</a></div>
    </header>
    <section class="content">
      <div class="frame-card"><iframe id="mainFrame" src="dashboard.html?v=20260810_hide_sku_detail"></iframe></div>
    </section>
  </main>
</div>
<script>
const navs=[...document.querySelectorAll('.nav')], frame=document.getElementById('mainFrame'), openNew=document.getElementById('openNew');
const BUILD_VERSION='20260813_shipping_grade_modules';
function versioned(src){ return src + (src.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(BUILD_VERSION); }
navs.forEach(btn=>btn.addEventListener('click',()=>{
  navs.forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  const src=btn.dataset.src; frame.src=versioned(src); openNew.href=versioned(src);
  document.getElementById('pageTitle').textContent='OrbitOps运营数据工作台｜'+btn.dataset.title;
  document.getElementById('pageCrumb').textContent=btn.dataset.crumb;
}));
</script>
</body>
</html>
