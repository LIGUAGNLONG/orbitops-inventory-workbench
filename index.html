<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OrbitOps运营数据工作台｜库存监控</title>
<style>
:root{--bg:#eef2f7;--panel:#ffffff;--line:#d9e1ec;--text:#182335;--muted:#6b7788;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--shadow:0 14px 40px rgba(15,23,42,.12)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f8fbff,#edf3fb 42%,#eef7ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.app{height:100vh;display:grid;grid-template-columns:72px 1fr;overflow:hidden}.rail{background:#162033;color:white;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:14px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:800;box-shadow:0 10px 26px rgba(37,99,235,.35)}.nav{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#b9c5d8;border:0;background:transparent;font-size:20px;cursor:pointer;text-decoration:none}.nav:hover{background:rgba(255,255,255,.08);color:white}.nav.active{background:rgba(255,255,255,.16);color:white}.nav small{position:absolute;left:64px;background:#0f172a;color:white;padding:5px 8px;border-radius:8px;font-size:12px;display:none;white-space:nowrap}.nav:hover small{display:block}.main{display:grid;grid-template-rows:64px 1fr;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(14px)}.title{font-size:18px;font-weight:800}.crumb{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:10px;align-items:center}.pill{font-size:12px;padding:7px 10px;border-radius:999px;background:#ecfdf5;color:#047857;border:1px solid #bbf7d0}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px;color:#334155;text-decoration:none;font-size:13px}.content{padding:16px;min-height:0}.frame-card{height:100%;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:46px 1fr}.frame-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(90deg,#fff,#f8fbff);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.dots{display:flex;gap:6px}.dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dot:nth-child(1){background:#ef4444}.dot:nth-child(2){background:#f59e0b}.dot:nth-child(3){background:#22c55e}iframe{width:100%;height:100%;border:0;background:white}.warn{color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:5px 9px;border-radius:999px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">O</div>
    <button class="nav active" data-src="dashboard.html" data-title="库存监控看板" data-crumb="飞书工作台 / 运营看板 / 库存监控 · FBA仓库存 + 海外仓库存">📊<small>库存监控</small></button>
    <button class="nav" data-src="fba_age_dashboard.html" data-title="在库库龄" data-crumb="飞书工作台 / 运营看板 / 在库库龄 · FBA库龄成本 + 数量">📦<small>在库库龄</small></button>
    <button class="nav" data-src="shipping_plan_dashboard.html" data-title="出货计划" data-crumb="飞书工作台 / 运营看板 / 出货计划 · 计划跟踪号 × 发运日期 × 数量">🚚<small>出货计划</small></button>
    <button class="nav" data-src="fba_age_dashboard.html" data-title="口径说明" data-crumb="当前口径：FBA库龄按数量维度和成本维度，补货模型匹配不到归其他">⚙️<small>口径说明</small></button>
  </aside>
  <main class="main">
    <header class="top">
      <div><div class="title" id="pageTitle">OrbitOps运营数据工作台｜库存监控</div><div class="crumb" id="pageCrumb">飞书工作台 / 运营看板 / 库存监控 · FBA仓库存 + 海外仓库存</div></div>
      <div class="actions"><span class="pill">FBA仓库存 + 海外仓库存</span><span class="pill">FBA库龄：数量 + 成本</span><a class="btn" id="openNew" href="dashboard.html" target="_blank">新窗口打开当前模块</a></div>
    </header>
    <section class="content">
      <div class="frame-card"><div class="frame-head"><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="frameLabel">库存监控看板</div><div class="warn">临时 Cloudflare 链接，断线需重开</div></div><iframe id="mainFrame" src="dashboard.html"></iframe></div>
    </section>
  </main>
</div>
<script>
const navs=[...document.querySelectorAll('.nav')], frame=document.getElementById('mainFrame'), openNew=document.getElementById('openNew');
navs.forEach(btn=>btn.addEventListener('click',()=>{
  navs.forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  const src=btn.dataset.src; frame.src=src; openNew.href=src;
  document.getElementById('pageTitle').textContent='OrbitOps运营数据工作台｜'+btn.dataset.title;
  document.getElementById('pageCrumb').textContent=btn.dataset.crumb;
  document.getElementById('frameLabel').textContent=btn.dataset.title;
}));
</script>
</body>
</html>
