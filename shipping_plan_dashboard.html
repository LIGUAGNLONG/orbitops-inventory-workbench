<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>出货计划｜产品等级预测开始日期统计</title><style>
:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ef;--text:#182335;--muted:#667085;--shadow:0 10px 28px rgba(15,23,42,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.wrap{padding:18px 20px 28px}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px;font-weight:850}.sub{color:var(--muted);font-size:13px;line-height:1.5}.badge{display:inline-block;padding:6px 10px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-size:12px;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.klabel{font-size:12px;color:var(--muted)}.kvalue{font-size:24px;font-weight:850;margin-top:6px}.kdesc{font-size:12px;color:var(--muted);margin-top:5px}.controls{display:grid;grid-template-columns:180px 150px 170px 170px 170px 1fr 110px;gap:10px;margin:12px 0}.ms{position:relative}.msBtn,input,button{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:white;color:var(--text)}.msBtn{width:100%;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px}.msBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msBtn:after{content:'▾';color:#667085;margin-left:8px}.ms.open .msBtn{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.msMenu{display:none;position:absolute;z-index:30;top:42px;left:0;width:260px;max-height:330px;overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(15,23,42,.16);padding:8px}.ms.open .msMenu{display:block}.msTools{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid #eef2f7;margin-bottom:6px}.miniBtn{height:26px;border-radius:7px;border:1px solid #dbe3ef;background:#f8fafc;color:#475467;font-size:12px;padding:0 8px;cursor:pointer}.msOpt{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-size:13px;cursor:pointer}.msOpt:hover{background:#f8fafc}.msOpt input{width:14px;height:14px;padding:0;margin:0}.msEmpty{color:#98a2b3;font-size:12px;padding:10px 6px}input{width:100%}button{background:#1d4ed8;color:white;border-color:#1d4ed8;font-weight:700;cursor:pointer}.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-top:12px}.ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}.hint{font-size:12px;color:var(--muted)}.chart{width:100%;height:390px;overflow:visible}.bar-label{font-size:11px;fill:#475467}.axis{font-size:11px;fill:#667085}.legendText{font-size:12px;fill:#475467}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){text-align:left}th{color:#475467;background:#f8fafc;position:sticky;top:0}.tablebox{max-height:420px;overflow:auto;border:1px solid #eef2f7;border-radius:12px}@media(max-width:1300px){.controls{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div><h1>出货计划 <span class="badge">产品等级 × 预测开始日期 × 数量</span></h1><div class="sub">数据源：库存数据源/出货计划；时间维度取“预测开始日期”；数量取“数量”字段。周筛选按发运日期所在自然周统计，周一到周日。</div></div><div class="sub" id="metaBox"></div></div><div class="controls"><div class="ms" id="fWeek"></div><div class="ms" id="fMonth"></div><div class="ms" id="fGrade"></div><div class="ms" id="fCreator"></div><div class="ms" id="fOwner"></div><input id="kw" placeholder="搜索产品等级 / 预测开始日期 / 创建人"/><button id="refresh">刷新</button></div><div class="panel"><div class="ptitle"><span>预测开始日期趋势：按产品等级折线</span><span class="hint">横轴=预测开始周｜纵轴=周计划数量｜颜色=产品等级</span></div><svg class="chart" id="dateChart"></svg></div><div class="panel"><div class="ptitle"><span>产品等级汇总</span><span class="hint">按数量倒序</span></div><div class="tablebox"><table id="trackTable"></table></div></div><div class="panel"><div class="ptitle"><span>产品等级 × 预测开始日期 明细</span><span class="hint">核心统计维度</span></div><div class="tablebox"><table id="summaryTable"></table></div></div></div><script>
let DATA={records:[],meta:{options:{},used_files:[]}}, records=[];
const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,'0');
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekInfo(s){if(!s)return {key:'',label:''};const d=new Date(s+'T00:00:00');if(isNaN(d))return {key:'',label:''};const day=d.getDay()||7;const mon=new Date(d);mon.setDate(d.getDate()-day+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const thu=new Date(mon);thu.setDate(mon.getDate()+3);const y=thu.getFullYear();const jan4=new Date(y,0,4);const jan4Day=jan4.getDay()||7;const week1Mon=new Date(jan4);week1Mon.setDate(jan4.getDate()-jan4Day+1);const w=Math.floor((mon-week1Mon)/604800000)+1;const key=y+'-W'+pad(w);return {key,label:key+' '+dateStr(mon).slice(5)+'~'+dateStr(sun).slice(5)};}
function uniq(a){return [...new Set(a.filter(Boolean))].sort();}
function selected(id){return [...document.querySelectorAll('#'+id+' input[type=checkbox]:checked')].map(x=>x.value);}
function updateMultiLabel(id){const root=$(id), vals=selected(id), ph=root.dataset.placeholder;root.querySelector('.msBtn span').textContent=vals.length?ph.replace('全部','已选')+' '+vals.length+'项':ph;}
function makeMulti(id, placeholder, values){const root=$(id);root.dataset.placeholder=placeholder;root.innerHTML='<div class="msBtn"><span>'+placeholder+'</span></div><div class="msMenu"><div class="msTools"><button type="button" class="miniBtn" data-act="all">全选</button><button type="button" class="miniBtn" data-act="clear">清空</button></div><div class="msList"></div></div>';const list=root.querySelector('.msList');if(!values.length){list.innerHTML='<div class="msEmpty">无可选项</div>'}else{list.innerHTML=values.map(v=>'<label class="msOpt"><input type="checkbox" value="'+String(v).replaceAll('"','&quot;')+'"><span>'+v+'</span></label>').join('')}root.querySelector('.msBtn').onclick=e=>{e.stopPropagation();document.querySelectorAll('.ms.open').forEach(x=>{if(x!==root)x.classList.remove('open')});root.classList.toggle('open')};root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{updateMultiLabel(id);render();});root.querySelector('[data-act=all]').onclick=e=>{e.stopPropagation();root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=true);updateMultiLabel(id);render();};root.querySelector('[data-act=clear]').onclick=e=>{e.stopPropagation();root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);updateMultiLabel(id);render();};}
document.addEventListener('click',()=>document.querySelectorAll('.ms.open').forEach(x=>x.classList.remove('open')));
async function loadData(){const res=await fetch('shipping_plan_data.json?ts='+Date.now());DATA=await res.json();records=(DATA.records||[]).map(r=>{const w=weekInfo(r.ship_date);return {...r,ship_week:w.key,ship_week_label:w.label};});init();}
function init(){const opt=DATA.meta.options||{};$('metaBox').innerHTML='生成时间：'+DATA.meta.generated_at+'<br>源文件：'+DATA.meta.used_files.length+' 个｜有效行：'+fmt(DATA.meta.raw_rows);makeMulti('fWeek','全部周',uniq(records.map(r=>r.ship_week_label)));makeMulti('fMonth','全部月份',uniq([...(opt.ship_month||[]),...records.map(r=>r.ship_month)]));makeMulti('fGrade','全部产品等级',uniq(['非新品',...(opt.grade||[]),...records.map(r=>r.grade)]));makeMulti('fCreator','全部创建人',uniq([...(opt.creator||[]),...records.map(r=>r.creator)]));makeMulti('fOwner','全部产品负责人',uniq([...(opt.owner||[]),...records.map(r=>r.owner)]));$('kw').oninput=render;$('refresh').onclick=render;render();}
function filtered(){const weeks=selected('fWeek'), months=selected('fMonth'), grades=selected('fGrade'), creators=selected('fCreator'), owners=selected('fOwner'), q=$('kw').value.trim().toLowerCase();const hasNonNew=grades.includes('非新品');return records.filter(r=>{const gradeOk=!grades.length||grades.includes(r.grade)||(hasNonNew&&r.grade!=='新品');return (!weeks.length||weeks.includes(r.ship_week_label))&&(!months.length||months.includes(r.ship_month))&&gradeOk&&(!creators.length||creators.includes(r.creator))&&(!owners.length||owners.includes(r.owner))&&(!q||[r.ship_date,r.forecast_start_date,r.ship_month,r.ship_week_label,r.grade,r.creator].join(' ').toLowerCase().includes(q));}).map(r=>hasNonNew&&r.grade!=='新品'?{...r,grade:'非新品'}:r);}
function groupBy(arr,keys){const mp=new Map();arr.forEach(r=>{const k=keys.map(x=>r[x]||'').join('||');if(!mp.has(k))mp.set(k,Object.fromEntries(keys.map(x=>[x,r[x]||''])));const x=mp.get(k);x.qty=(x.qty||0)+Number(r.qty||0);x.line_count=(x.line_count||0)+Number(r.line_count||1);x.sku_count=(x.sku_count||0)+Number(r.sku_count||0);x.doc_count=(x.doc_count||0)+Number(r.doc_count||0);});return [...mp.values()];}
function render(){const arr=filtered();renderChart(arr);renderTables(arr);}
function renderChart(arr){const svg=$('dateChart');svg.innerHTML='';const weeks=uniq(arr.map(r=>r.ship_week_label));const tracks=uniq(arr.map(r=>r.grade||'未填写'));if(!arr.length||!weeks.length||!tracks.length){svg.setAttribute('viewBox','0 0 1200 390');const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x','600');t.setAttribute('y','190');t.setAttribute('text-anchor','middle');t.setAttribute('class','axis');t.textContent='当前筛选无数据';svg.appendChild(t);return;}const colors=['#2563eb','#f97316','#16a34a','#dc2626','#7c3aed','#0891b2','#be123c','#ca8a04','#0f766e','#4338ca'];const by={};tracks.forEach(t=>{by[t]={};weeks.forEach(w=>by[t][w]=0);});arr.forEach(r=>{const g=r.grade||'未填写';if(g&&r.ship_week_label){by[g][r.ship_week_label]=(by[g][r.ship_week_label]||0)+Number(r.qty||0);}});const W=svg.clientWidth||1200,H=390,p={l:72,r:34,t:42,b:96},cw=W-p.l-p.r,ch=H-p.t-p.b;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);function add(tag,attrs,text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}const max=Math.max(...tracks.flatMap(t=>weeks.map(w=>by[t][w]||0)),1);add('line',{x1:p.l,y1:p.t+ch,x2:W-p.r,y2:p.t+ch,stroke:'#cbd5e1'});add('line',{x1:p.l,y1:p.t,x2:p.l,y2:p.t+ch,stroke:'#cbd5e1'});[0,.25,.5,.75,1].forEach(v=>{const y=p.t+ch-v*ch;add('line',{x1:p.l,y1:y,x2:W-p.r,y2:y,stroke:'#eef2f7'});add('text',{x:p.l-10,y:y+4,'text-anchor':'end',class:'axis'},fmt(max*v));});const xOf=i=>p.l+(weeks.length<=1?cw/2:i*cw/(weeks.length-1));const yOf=v=>p.t+ch-(v/max*ch);weeks.forEach((w,i)=>{const x=xOf(i);const label=w.replace(/^([0-9]{4}-W[0-9]{2}) /,'$1\n');const parts=label.split('\n');add('text',{x:x,y:H-52,'text-anchor':'middle',class:'axis'},parts[0]);if(parts[1])add('text',{x:x,y:H-36,'text-anchor':'middle',class:'axis'},parts[1]);});tracks.forEach((t,ti)=>{const color=colors[ti%colors.length];const pts=weeks.map((w,i)=>`${xOf(i)},${yOf(by[t][w]||0)}`).join(' ');add('polyline',{points:pts,fill:'none',stroke:color,'stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'});weeks.forEach((w,i)=>{const v=by[t][w]||0;if(v>0){const x=xOf(i),y=yOf(v);add('circle',{cx:x,cy:y,r:3.5,fill:color,stroke:'#fff','stroke-width':1.5});if(v>=max*.12)add('text',{x:x,y:y-8,'text-anchor':'middle',class:'bar-label',fill:color},fmt(v));}});});tracks.forEach((t,i)=>{const color=colors[i%colors.length],x=p.l+(i%6)*155,y=16+Math.floor(i/6)*18;add('line',{x1:x,y1:y,x2:x+18,y2:y,stroke:color,'stroke-width':3});add('circle',{cx:x+9,cy:y,r:3,fill:color});add('text',{x:x+24,y:y+4,class:'legendText'},t);});}

function renderTables(arr){let tracks=groupBy(arr,['grade']).sort((a,b)=>b.qty-a.qty);trackTable.innerHTML='<thead><tr><th>产品等级</th><th>数量</th><th>SKU数</th><th>单据数</th><th>明细行</th></tr></thead><tbody>'+tracks.map(r=>`<tr><td>${r.grade||'未填写'}</td><td>${fmt(r.qty)}</td><td>${fmt(r.sku_count)}</td><td>${fmt(r.doc_count)}</td><td>${fmt(r.line_count)}</td></tr>`).join('')+'</tbody>';let sum=groupBy(arr,['grade','ship_week_label','ship_date','ship_month']).sort((a,b)=>String(a.ship_date).localeCompare(String(b.ship_date))||b.qty-a.qty);summaryTable.innerHTML='<thead><tr><th>产品等级</th><th>周</th><th>预测开始日期</th><th>月份</th><th>数量</th><th>SKU数</th><th>单据数</th><th>明细行</th></tr></thead><tbody>'+sum.map(r=>`<tr><td>${r.grade||'未填写'}</td><td>${r.ship_week_label}</td><td>${r.ship_date}</td><td>${r.ship_month}</td><td>${fmt(r.qty)}</td><td>${fmt(r.sku_count)}</td><td>${fmt(r.doc_count)}</td><td>${fmt(r.line_count)}</td></tr>`).join('')+'</tbody>';}
loadData();
</script></body></html>
