<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>出货计划｜产品等级预测开始日期统计</title><style>
:root{--bg:#f6f8fc;--card:#fff;--line:#dbe3ef;--text:#182335;--muted:#667085;--shadow:0 10px 28px rgba(15,23,42,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.wrap{padding:18px 20px 28px}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:24px;margin:0 0 6px;font-weight:850}.sub{color:var(--muted);font-size:13px;line-height:1.5}.badge{display:inline-block;padding:6px 10px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;font-size:12px;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.klabel{font-size:12px;color:var(--muted)}.kvalue{font-size:24px;font-weight:850;margin-top:6px}.kdesc{font-size:12px;color:var(--muted);margin-top:5px}.controls{display:grid;grid-template-columns:180px 150px 170px 160px 160px 170px 125px 125px minmax(260px,1fr) 110px;gap:10px;margin:12px 0}@media(max-width:1400px){.controls{grid-template-columns:repeat(5,minmax(150px,1fr))}}.ms{position:relative}.msBtn,input,select,button{height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:white;color:var(--text)}.msBtn{width:100%;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px}.msBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msBtn:after{content:'▾';color:#667085;margin-left:8px}.ms.open .msBtn{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}.msMenu{display:none;position:absolute;z-index:30;top:42px;left:0;width:260px;max-height:330px;overflow:auto;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(15,23,42,.16);padding:8px}.ms.open .msMenu{display:block}.msTools{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid #eef2f7;margin-bottom:6px}.miniBtn{height:26px;border-radius:7px;border:1px solid #dbe3ef;background:#f8fafc;color:#475467;font-size:12px;padding:0 8px;cursor:pointer}.msOpt{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-size:13px;cursor:pointer}.msOpt:hover{background:#f8fafc}.msOpt input{width:14px;height:14px;padding:0;margin:0}.msEmpty{color:#98a2b3;font-size:12px;padding:10px 6px}input{width:100%}button{background:#1d4ed8;color:white;border-color:#1d4ed8;font-weight:700;cursor:pointer}.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-top:12px}.ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}.hint{font-size:12px;color:var(--muted)}.chart{width:100%;height:390px;overflow:visible}.bar-label{font-size:11px;fill:#475467}.axis{font-size:11px;fill:#667085}.legendText{font-size:12px;fill:#475467}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 9px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){text-align:left}th{color:#475467;background:#f8fafc;position:sticky;top:0}.tablebox{max-height:420px;overflow:auto;border:1px solid #eef2f7;border-radius:12px}@media(max-width:1300px){.controls{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div><h1>出货计划 <span class="badge">产品等级 × 预测开始日期 × 数量 × 采购成本</span></h1><div class="sub">数据源：库存数据源/出货计划；时间维度取“预测开始日期”；数量取“数量”字段；采购单价取物料列表“采购成本(CNY）”，按物料编码匹配。周筛选按预测开始日期所在自然周统计，周一到周日。</div></div><div class="sub" id="metaBox"></div></div><div class="controls"><div class="ms" id="fWeek"></div><div class="ms" id="fMonth"></div><div class="ms" id="fDocType"></div><div class="ms" id="fGrade"></div><div class="ms" id="fCreator"></div><div class="ms" id="fOwner"></div><select id="metric" aria-label="展示指标"><option value="qty">展示：数量</option><option value="total_cost">展示：采购成本</option></select><input id="kw" placeholder="搜索单据类型 / 产品等级 / 日期 / 创建人"/><button id="refresh">刷新</button></div><div class="panel"><div class="ptitle"><span id="chartTitle">预测开始日期分布：按产品等级</span><span class="hint" id="chartHint">列=预测开始周｜行=产品等级｜单元格=周计划数量</span></div><div class="tablebox"><table id="dateChart"></table></div></div><div class="panel"><div class="ptitle"><span id="monthChartTitle">预测开始月份分布：按产品等级</span><span class="hint" id="monthChartHint">列=预测开始月份｜行=产品等级｜单元格=月计划数量</span></div><div class="tablebox"><table id="monthChart"></table></div></div><div class="panel"><div class="ptitle"><span>产品等级汇总</span><span class="hint" id="trackHint">按数量倒序，采购成本=数量×采购单价</span></div><div class="tablebox"><table id="trackTable"></table></div></div><div class="panel"><div class="ptitle"><span>产品等级 × 预测开始日期 明细</span><span class="hint" id="summaryHint">核心统计维度，支持采购成本范围筛选</span></div><div class="tablebox"><table id="summaryTable"></table></div></div></div><script>
let DATA={records:[],meta:{options:{},used_files:[]}}, records=[];
const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});const metricKey=()=>$('metric').value;const metricLabel=()=>metricKey()==='total_cost'?'采购成本（元）':'数量';const metricFmt=n=>metricKey()==='total_cost'?'¥'+fmt(n):fmt(n);
const pad=n=>String(n).padStart(2,'0');
function dateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekInfo(s){if(!s)return {key:'',label:''};const d=new Date(s+'T00:00:00');if(isNaN(d))return {key:'',label:''};const day=d.getDay()||7;const mon=new Date(d);mon.setDate(d.getDate()-day+1);const sun=new Date(mon);sun.setDate(mon.getDate()+6);const thu=new Date(mon);thu.setDate(mon.getDate()+3);const y=thu.getFullYear();const jan4=new Date(y,0,4);const jan4Day=jan4.getDay()||7;const week1Mon=new Date(jan4);week1Mon.setDate(jan4.getDate()-jan4Day+1);const w=Math.floor((mon-week1Mon)/604800000)+1;const key=y+'-W'+pad(w);return {key,label:key+' '+dateStr(mon).slice(5)+'~'+dateStr(sun).slice(5)};}
function uniq(a){return [...new Set(a.filter(Boolean))].sort();}
const GRADE_ORDER=['非新品','新品','A','B','C','D','淘汰'];
function sortGrades(values){const rank=v=>{const i=GRADE_ORDER.indexOf(v);return i>=0?i:999};return [...values].sort((a,b)=>rank(a)-rank(b)||String(a).localeCompare(String(b),'zh-CN'));}
function selected(id){return [...document.querySelectorAll('#'+id+' input[type=checkbox]:checked')].map(x=>x.value);}
function updateMultiLabel(id){const root=$(id), vals=selected(id), ph=root.dataset.placeholder;root.querySelector('.msBtn span').textContent=vals.length?ph.replace('全部','已选')+' '+vals.length+'项':ph;}
function makeMulti(id, placeholder, values){const root=$(id);root.dataset.placeholder=placeholder;root.innerHTML='<div class="msBtn"><span>'+placeholder+'</span></div><div class="msMenu"><div class="msTools"><button type="button" class="miniBtn" data-act="all">全选</button><button type="button" class="miniBtn" data-act="clear">清空</button></div><div class="msList"></div></div>';const list=root.querySelector('.msList');if(!values.length){list.innerHTML='<div class="msEmpty">无可选项</div>'}else{list.innerHTML=values.map(v=>'<label class="msOpt"><input type="checkbox" value="'+String(v).replaceAll('"','&quot;')+'"><span>'+v+'</span></label>').join('')}root.querySelector('.msBtn').onclick=e=>{e.stopPropagation();document.querySelectorAll('.ms.open').forEach(x=>{if(x!==root)x.classList.remove('open')});root.classList.toggle('open')};root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{updateMultiLabel(id);render();});root.querySelector('[data-act=all]').onclick=e=>{e.stopPropagation();root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=true);updateMultiLabel(id);render();};root.querySelector('[data-act=clear]').onclick=e=>{e.stopPropagation();root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);updateMultiLabel(id);render();};}
document.addEventListener('click',()=>document.querySelectorAll('.ms.open').forEach(x=>x.classList.remove('open')));
async function loadData(){const res=await fetch('shipping_plan_data.json?ts='+Date.now());DATA=await res.json();records=(DATA.records||[]).map(r=>{const w=weekInfo(r.ship_date);return {...r,ship_week:w.key,ship_week_label:w.label};});init();}
function init(){const opt=DATA.meta.options||{};$('metaBox').innerHTML='生成时间：'+DATA.meta.generated_at+'<br>源文件：'+DATA.meta.used_files.length+' 个｜有效行：'+fmt(DATA.meta.raw_rows)+'<br>采购成本：¥'+fmt(DATA.meta.total_cost)+'｜单价匹配：'+fmt(DATA.meta.cost_match_rows)+'/'+fmt(DATA.meta.raw_rows);makeMulti('fWeek','全部周',uniq(records.map(r=>r.ship_week_label)));makeMulti('fMonth','全部月份',uniq([...(opt.ship_month||[]),...records.map(r=>r.ship_month)]));makeMulti('fDocType','全部单据类型',uniq([...(opt.doc_type||[]),...records.map(r=>r.doc_type)]));makeMulti('fGrade','全部产品等级',sortGrades(uniq(['非新品',...(opt.grade||[]),...records.map(r=>r.grade)])));makeMulti('fCreator','全部创建人',uniq([...(opt.creator||[]),...records.map(r=>r.creator)]));makeMulti('fOwner','全部产品负责人',uniq([...(opt.owner||[]),...records.map(r=>r.owner)]));$('kw').oninput=render;$('metric').onchange=render;$('refresh').onclick=render;render();}
const NON_NEW_GRADES=['A','B','C','D','淘汰'];

function isNonNewGrade(g){return NON_NEW_GRADES.includes(g);}

function filtered(){const weeks=selected('fWeek'), months=selected('fMonth'), docTypes=selected('fDocType'), grades=selected('fGrade'), creators=selected('fCreator'), owners=selected('fOwner'), q=$('kw').value.trim().toLowerCase();const hasNonNew=grades.includes('非新品');return records.filter(r=>{const gradeOk=!grades.length||grades.includes(r.grade)||(hasNonNew&&isNonNewGrade(r.grade));return (!weeks.length||weeks.includes(r.ship_week_label))&&(!months.length||months.includes(r.ship_month))&&(!docTypes.length||docTypes.includes(r.doc_type))&&gradeOk&&(!creators.length||creators.includes(r.creator))&&(!owners.length||owners.includes(r.owner))&&(!q||[r.doc_type,r.ship_date,r.forecast_start_date,r.ship_month,r.ship_week_label,r.grade,r.creator].join(' ').toLowerCase().includes(q));}).map(r=>hasNonNew&&isNonNewGrade(r.grade)?{...r,grade:'非新品'}:r);}
function groupBy(arr,keys){const mp=new Map();arr.forEach(r=>{const k=keys.map(x=>r[x]||'').join('||');if(!mp.has(k))mp.set(k,Object.fromEntries(keys.map(x=>[x,r[x]||''])));const x=mp.get(k);x.qty=(x.qty||0)+Number(r.qty||0);x.total_cost=(x.total_cost||0)+Number(r.total_cost||0);x.line_count=(x.line_count||0)+Number(r.line_count||1);x.sku_count=(x.sku_count||0)+Number(r.sku_count||0);x.doc_count=(x.doc_count||0)+Number(r.doc_count||0);});return [...mp.values()];}
function render(){const label=metricLabel();$('chartTitle').textContent='预测开始日期分布：按产品等级（'+label+'）';$('chartHint').textContent='列=预测开始周｜行=产品等级｜单元格=周计划'+label;$('monthChartTitle').textContent='预测开始月份分布：按产品等级（'+label+'）';$('monthChartHint').textContent='列=预测开始月份｜行=产品等级｜单元格=月计划'+label;$('trackHint').textContent='按'+label+'倒序；切换指标后各表同步变化';$('summaryHint').textContent='核心统计维度，当前展示：'+label;const arr=filtered();renderPeriodTable(arr,'dateChart','ship_week_label','预测开始周');renderPeriodTable(arr,'monthChart','ship_month','预测开始月份');renderTables(arr);}
function renderPeriodTable(arr,tableId,periodField,periodLabel){const table=$(tableId),key=metricKey();const periods=uniq(arr.map(r=>r[periodField]).filter(Boolean));const grades=sortGrades(uniq(arr.map(r=>r.grade||'未填写')));if(!arr.length||!periods.length||!grades.length){table.innerHTML='<tbody><tr><td style="text-align:center;color:#667085">当前筛选无数据</td></tr></tbody>';return;}const by={};grades.forEach(g=>{by[g]={};periods.forEach(p=>by[g][p]=0);});arr.forEach(r=>{const g=r.grade||'未填写',p=r[periodField];if(p)by[g][p]=(by[g][p]||0)+Number(r[key]||0);});const total=periods.map(p=>grades.reduce((n,g)=>n+Number(by[g][p]||0),0));table.innerHTML='<thead><tr><th>产品等级</th>'+periods.map(p=>'<th>'+p+'</th>').join('')+'<th>合计</th></tr></thead><tbody>'+grades.map(g=>{const vals=periods.map(p=>Number(by[g][p]||0));return '<tr><td>'+g+'</td>'+vals.map(v=>'<td>'+metricFmt(v)+'</td>').join('')+'<td><b>'+metricFmt(vals.reduce((a,b)=>a+b,0))+'</b></td></tr>';}).join('')+'<tr><td><b>合计</b></td>'+total.map(v=>'<td><b>'+metricFmt(v)+'</b></td>').join('')+'<td><b>'+metricFmt(total.reduce((a,b)=>a+b,0))+'</b></td></tr></tbody>';}

function renderTables(arr){const key=metricKey(), label=metricLabel();let tracks=groupBy(arr,['grade']).sort((a,b)=>Number(b[key]||0)-Number(a[key]||0));trackTable.innerHTML='<thead><tr><th>产品等级</th><th>'+label+'</th><th>SKU数</th><th>单据数</th><th>明细行</th></tr></thead><tbody>'+tracks.map(r=>`<tr><td>${r.grade||'未填写'}</td><td>${metricFmt(r[key])}</td><td>${fmt(r.sku_count)}</td><td>${fmt(r.doc_count)}</td><td>${fmt(r.line_count)}</td></tr>`).join('')+'</tbody>';let sum=groupBy(arr,['grade','ship_week_label','ship_date','ship_month']).sort((a,b)=>String(a.ship_date).localeCompare(String(b.ship_date))||Number(b[key]||0)-Number(a[key]||0));summaryTable.innerHTML='<thead><tr><th>产品等级</th><th>周</th><th>预测开始日期</th><th>月份</th><th>'+label+'</th><th>SKU数</th><th>单据数</th><th>明细行</th></tr></thead><tbody>'+sum.map(r=>`<tr><td>${r.grade||'未填写'}</td><td>${r.ship_week_label}</td><td>${r.ship_date}</td><td>${r.ship_month}</td><td>${metricFmt(r[key])}</td><td>${fmt(r.sku_count)}</td><td>${fmt(r.doc_count)}</td><td>${fmt(r.line_count)}</td></tr>`).join('')+'</tbody>';}
loadData();
</script></body></html>
