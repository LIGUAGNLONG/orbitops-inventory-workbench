<script>
const DATA=JSON.parse(document.getElementById('payload').textContent);
const buckets=DATA.options.buckets;
const fmtNum=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const fmtMoney=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const pct=n=>(Number(n||0)*100).toFixed(1)+'%';
function init(){
 const w=document.getElementById('weekSel'); DATA.options.weeks.forEach(x=>{let o=document.createElement('option');o.value=x.week_start;o.textContent=x.week_label+'｜'+x.week_start;w.appendChild(o)}); w.value=DATA.meta.latest_week_start;
 fillSelect('catSel', DATA.options.categories||[], '全部三级类目');
 document.getElementById('metaBox').innerHTML='生成时间：'+DATA.meta.generated_at+'<br>源目录：FBA库龄<br>口径：补货模型匹配，不到=其他';
 ['refresh','dimSel','weekSel','catSel'].forEach(id=>document.getElementById(id).onchange=render);
 document.getElementById('kw').oninput=render; render();
}
function fillSelect(id, values, allText){const el=document.getElementById(id); const cur=el.value; el.innerHTML=''; let all=document.createElement('option'); all.value=''; all.textContent=allText||'全部'; el.appendChild(all); values.forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)}); if([...el.options].some(o=>o.value===cur))el.value=cur;}
function detailFiltered(){const week=weekSel.value, cat=catSel.value, k=kw.value.trim().toLowerCase(); return (DATA.detail_by_week||[]).filter(r=>r.week_start===week && (!cat||r['三级类目']===cat) && (!k||[r['三级类目'],r['运营人员'],r['定级']].join(' ').toLowerCase().includes(k)));}
function currentRows(){const dim=dimSel.value; const map={}; detailFiltered().forEach(r=>{const item=dim==='总览'?'全部':(r[dim]||'其他'); const key=item+'\u0001'+r.bucket; const m=map[key]||(map[key]={week_start:r.week_start,week_label:r.week_label,dimension:dim,item,bucket:r.bucket,bucket_order:r.bucket_order,qty:0,cost:0}); m.qty+=Number(r.qty||0); m.cost+=Number(r.cost||0);}); return Object.values(map);}
function render(){renderKpis(); renderChart(); renderDimTable(); renderTopTable();}
function renderKpis(){
 const rows=detailFiltered();
 let cost={}, qty={}; buckets.forEach(b=>{cost[b]=0; qty[b]=0;}); rows.forEach(r=>{cost[r.bucket]=(cost[r.bucket]||0)+Number(r.cost||0); qty[r.bucket]=(qty[r.bucket]||0)+Number(r.qty||0);});
 const total=Object.values(cost).reduce((a,b)=>a+b,0)||0;
 const share=(names)=>pct(names.reduce((s,b)=>s+(cost[b]||0),0)/(total||1));
 const sum=(obj,names)=>names.reduce((s,b)=>s+(obj[b]||0),0);
 const setCard=(kid,did,names)=>{document.getElementById(kid).textContent=share(names); document.getElementById(did).innerHTML='数量：'+fmtNum(sum(qty,names))+'<br>成本：'+fmtMoney(sum(cost,names));};
 setCard('kAge0','dAge0',['0-30天']);
 setCard('kAge30','dAge30',['31-60天']);
 setCard('kAge60','dAge60',['61-90天']);
 setCard('kAge90','dAge90',['91-180天']);
 setCard('kAge180','dAge180',['181-270天','271-330天','331-365天','365天以上']);
}
function renderChart(){
 const svg=document.getElementById('chart'); svg.innerHTML=''; const rows=currentRows(); const dim=dimSel.value;
 let agg={}; buckets.forEach(b=>agg[b]={qty:0,cost:0}); rows.forEach(r=>{agg[r.bucket].qty+=Number(r.qty||0); agg[r.bucket].cost+=Number(r.cost||0);});
 const W=svg.clientWidth||1000,H=360, pad={l:64,r:30,t:22,b:58}, cw=W-pad.l-pad.r, ch=H-pad.t-pad.b; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const maxCost=Math.max(...buckets.map(b=>agg[b].cost),1); const bw=cw/buckets.length*0.56;
 function add(tag,attrs,text){let e=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in attrs)e.setAttribute(k,attrs[k]); if(text!==undefined)e.textContent=text; svg.appendChild(e); return e;}
 add('line',{x1:pad.l,y1:pad.t+ch,x2:W-pad.r,y2:pad.t+ch,stroke:'#cbd5e1'}); add('line',{x1:pad.l,y1:pad.t,x2:pad.l,y2:pad.t+ch,stroke:'#cbd5e1'});
 buckets.forEach((b,i)=>{const x=pad.l+i*cw/buckets.length+(cw/buckets.length-bw)/2; const bh=agg[b].cost/maxCost*ch; const y=pad.t+ch-bh; add('rect',{x,y,width:bw,height:Math.max(1,bh),rx:8,fill:i>=3?'#f97316':'#2563eb',opacity:.82}); add('text',{x:x+bw/2,y:y-7,'text-anchor':'middle',class:'bar-label'},fmtMoney(agg[b].cost)); add('text',{x:x+bw/2,y:y+15,'text-anchor':'middle',class:'bar-label',fill:'#0f172a'},fmtNum(agg[b].qty)); add('text',{x:x+bw/2,y:H-26,'text-anchor':'middle',class:'axis'},b); });
 const cat=catSel.value?('｜'+catSel.value):'';
 document.getElementById('chartTitle').textContent='库龄分布｜'+weekSel.options[weekSel.selectedIndex].text+'｜'+dim+cat;
}
function renderDimTable(){
 const rows=currentRows(); let map={}; rows.forEach(r=>{let m=map[r.item]||(map[r.item]={item:r.item,qty:0,cost:0,oldQty:0,oldCost:0}); m.qty+=Number(r.qty||0); m.cost+=Number(r.cost||0); if(['91-180天','181-270天','271-330天','331-365天','365天以上'].includes(r.bucket)){m.oldQty+=Number(r.qty||0);m.oldCost+=Number(r.cost||0);}});
 let arr=Object.values(map).sort((a,b)=>b.cost-a.cost).slice(0,80); let html='<thead><tr><th>维度项</th><th>库存数量</th><th>库存成本</th><th>90天以上数量</th><th>90天以上成本</th><th>老库龄成本占比</th></tr></thead><tbody>';

}
function renderTopTable(){
 const rows=detailFiltered(); let map={}; rows.forEach(r=>{const key=[r['三级类目'],r['运营人员'],r['定级']].join('\u0001'); const m=map[key]||(map[key]={'三级类目':r['三级类目'],'运营人员':r['运营人员'],'定级':r['定级'],qty:0,cost:0}); m.qty+=Number(r.qty||0); m.cost+=Number(r.cost||0);});
 let arr=Object.values(map).sort((a,b)=>b.cost-a.cost).slice(0,120);

 arr.forEach(r=>html+=`<tr><td>${r['三级类目']}</td><td>${r['运营人员']}</td><td>${r['定级']}</td><td>${fmtNum(r.qty)}</td><td>${fmtMoney(r.cost)}</td></tr>`); topTable.innerHTML=html+'</tbody>';
}
init();
