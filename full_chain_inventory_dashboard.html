<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全链路库存｜OrbitOps</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--line:#dbe4ef;--ink:#152238;--muted:#6e7c91;--blue:#2d74df;--mint:#69cdb9;--purple:#a590df;--grey:#9ba4ad;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7faff,#f3f7fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}.wrap{padding:28px 30px 36px;max-width:1640px;margin:auto}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#2869c7}.head{display:flex;align-items:start;justify-content:space-between;gap:18px}.head h1{font-size:28px;margin:6px 0 8px}.sub{font-size:13px;color:var(--muted);line-height:1.65}.status{border:1px solid #bfdbfe;background:#eff6ff;color:#2461b7;border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 4px 16px #0f172a08}.filter-label{font-size:12px;font-weight:700;color:#4b5a70}.metric{appearance:none;border:1px solid #cbd7e6;background:#fff;border-radius:9px;padding:9px 31px 9px 12px;color:#1e293b;font-size:13px;background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}.filter-note{font-size:12px;color:var(--muted);padding-left:3px}.section-title{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:23px 0 10px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px}.warehouse{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:14px;min-height:245px;box-shadow:0 8px 24px #0f172a09}.warehouse.pending{opacity:.84;background:linear-gradient(135deg,#fff,#fafafa)}.wtitle{font-weight:800;font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tag{font-weight:600;font-size:11px;padding:3px 7px;border-radius:99px;background:#f1f5f9;color:#64748b}.tag.ok{background:#ecfdf5;color:#047857}.row{padding:11px 0;border-top:1px dashed #d9e1eb}.row:first-of-type{border-top:0}.rlabel{font-size:12px;color:#4b5a70;margin-bottom:4px}.rvalue{font-size:20px;font-weight:800;letter-spacing:-.02em}.rsub{font-size:11px;color:#758297;margin-top:3px}.pending-body{height:184px;display:flex;align-items:center;justify-content:center;text-align:center;color:#718096;font-size:13px;line-height:1.7}.panel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 8px 24px #0f172a07}.panel h2{font-size:15px;margin:0 0 12px}.bars{display:grid;gap:12px}.barrow{display:grid;grid-template-columns:88px 1fr 155px;gap:12px;align-items:center;font-size:13px}.track{height:16px;border-radius:99px;background:#edf2f7;overflow:hidden}.fill{height:100%;border-radius:99px;min-width:2px}.barvalue{text-align:right;font-weight:750}.legend{font-size:12px;color:var(--muted);border-top:1px solid #eef2f7;margin-top:14px;padding-top:11px;line-height:1.7}.source{font-size:11px;color:#8a97a9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:11px}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:20px 14px}.cards{grid-template-columns:1fr}.head{display:block}.status{display:inline-block;margin-top:10px}.barrow{grid-template-columns:72px 1fr 105px}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">FULL-CHAIN INVENTORY</div><h1>全链路库存</h1><div class="sub">已接入 FBA 仓与海外仓的库存、在途及成本汇总；沃尔玛平台仓、TK平台仓、国内仓在正式源校验后再纳入，先不拿不准的数据凑数。</div></div><div class="status" id="status">加载中…</div></header>
<div class="filters"><span class="filter-label">统计指标</span><select class="metric" id="metric"><option value="qty">数量</option><option value="cost_total">总成本</option><option value="cost_excl_first_mile">不含头程成本</option></select><span class="filter-note" id="metricNote">库存数量（件）</span></div>
<section><div class="section-title"><h2>仓库模块</h2><span>各模块随“统计指标”筛选实时切换</span></div><div class="cards" id="cards"></div></section>
<section class="panel"><h2>已接入库存结构</h2><div class="bars" id="bars"></div><div class="legend" id="note"></div></section></main>
<script>
const $=x=>document.getElementById(x);let DATA;const labels={qty:'数量（件）',cost_total:'总成本',cost_excl_first_mile:'不含头程成本'};const money=x=>'¥'+Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:0}),num=x=>Number(x||0).toLocaleString('zh-CN',{maximumFractionDigits:0});const fmt=(x,m)=>m==='qty'?num(x):money(x);const colors=['#a590df','#4b90e9','#a5aeb8','#f59e0b','#76cdb9','#64748b'];
function render(){const metric=$('metric').value;$('metricNote').textContent=labels[metric];$('status').textContent='快照：'+DATA.meta.snapshot_date+' · 库存属性：'+(DATA.meta.stock_attribute||'全部')+' · '+DATA.meta.generated_at;const cards=DATA.warehouses.map((w,i)=>{if(!w.values)return `<article class="warehouse pending" style="--accent:${colors[i]}"><div class="wtitle"><span>${w.name}</span><b class="tag">${w.status}</b></div><div class="pending-body">${w.name}正式库存源尚未确认，<br>当前不展示也不并入总库存。</div><div class="source" title="${w.source}">来源：${w.source}</div></article>`;let v=w.values;return `<article class="warehouse" style="--accent:${colors[i]}"><div class="wtitle"><span>${w.name}</span><b class="tag ${w.status.includes('接入')?'ok':''}">${w.status}</b></div><div class="row"><div class="rlabel">总库存</div><div class="rvalue">${fmt(v.total_inventory[metric],metric)}</div><div class="rsub">期末在库 + 期末在途</div></div><div class="row"><div class="rlabel">期末在库</div><div class="rvalue">${fmt(v.ending_stock[metric],metric)}</div></div><div class="row"><div class="rlabel">期末在途</div><div class="rvalue">${fmt(v.ending_transit[metric],metric)}</div></div><div class="source" title="${w.source}">${w.name==='沃尔玛平台仓'?'统计口径：WFS可售/标发在途；头程成本＝0':'统计口径：库存属性＝全部'}<br>来源：${w.source}</div></article>`}).join('');$('cards').innerHTML=cards;const active=DATA.warehouses.filter(x=>x.values&&x.name!=='总库存'),tot=DATA.warehouses.find(x=>x.name==='总库存').values.total_inventory[metric],max=Math.max(...active.map(x=>x.values.total_inventory[metric]),1);$('bars').innerHTML=active.map((w,i)=>{let v=w.values.total_inventory[metric],p=v/max*100,share=v/tot*100;return `<div class="barrow"><b>${w.name}</b><div class="track"><div class="fill" style="width:${p}%;background:${colors[i]}"></div></div><span class="barvalue">${fmt(v,metric)} <small style="color:#8190a5;font-weight:500">${share.toFixed(1)}%</small></span></div>`}).join('');$('note').textContent=DATA.meta.coverage_note+'  口径：总成本=源报表“总成本”；不含头程成本=总成本−头程成本。';}
fetch('full_chain_inventory_data.json?v=20261014_walmart_included').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;$('metric').onchange=render;render()}).catch(e=>{$('status').textContent='数据加载失败：'+e.message;console.error(e)});
</script></body></html>
