<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>需求预测｜7-12月预测</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--line:#dbe3ee;--text:#122033;--muted:#6b7788;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 12px 32px rgba(15,23,42,.10)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f8fbff,#eef4fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.wrap{padding:22px 26px 34px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.title h1{font-size:26px;margin:0 0 8px;font-weight:900;letter-spacing:-.02em}.title p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#ecfeff;border:1px solid #a5f3fc;color:#0e7490;font-weight:800;font-size:13px;white-space:nowrap}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(150px,1fr));margin-bottom:14px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.kpi .label{color:var(--muted);font-size:13px;margin-bottom:8px}.kpi .val{font-size:25px;font-weight:900}.kpi .sub{color:var(--muted);font-size:12px;margin-top:6px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;min-width:150px}.two{grid-template-columns:1.4fr .9fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:17px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #edf1f7;padding:9px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#475569;background:#f8fafc;font-weight:800;position:sticky;top:0}.scroll{max-height:360px;overflow:auto}.chart{height:300px}.bar{height:10px;background:#e8eef7;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px}.neg{color:var(--red)}.pos{color:var(--green)}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.8}.src{font-size:12px;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:12px;margin-top:14px;word-break:break-all}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.danger{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857}@media(max-width:1000px){.kpis,.two,.three{grid-template-columns:1fr}.hero{display:block}.badge{margin-top:12px}}
</style></head><body><div class="wrap">
  <section class="hero"><div class="title"><h1>需求预测｜7-12月预测分析</h1><p>数据来自 04_需求计划 最新预测文件；展示基础预测、LightGBM、CatBoost 与最新人工预测对比。人工预测只作复核参考，不反推模型。</p></div><div class="badge">📈 固定看板模块｜数据随发布版本更新</div></section>
  <section class="grid kpis" id="kpis"></section>
  <section class="filters"><select id="model"><option>基础预测</option><option>LightGBM</option><option>CatBoost</option></select><select id="month"><option value="全部">全部月份</option></select><input id="q" placeholder="搜索类目 / 负责人 / SKU"/></section>
  <section class="grid two"><div class="card"><h2>月度预测趋势</h2><div id="chart" class="chart"></div></div><div class="card"><h2>月度总览</h2><div class="scroll"><table id="monthTable"></table></div></div></section>
  <section class="grid three" style="margin-top:14px"><div class="card"><h2>产品定位汇总</h2><div class="scroll"><table id="posTable"></table></div></div><div class="card"><h2>三级类目 TOP</h2><div class="scroll"><table id="catTable"></table></div></div><div class="card"><h2>负责人 TOP</h2><div class="scroll"><table id="ownerTable"></table></div></div></section>
  <section class="card" style="margin-top:14px"><h2>人工差异与低置信复核清单 TOP</h2><div class="note">优先看差异绝对值大、人工差异超过30%、人工缺失但基础有量的 SKU。</div><div class="scroll"><table id="reviewTable"></table></div></section>
  <section class="src" id="src"></section>
</div>
<script>
let DATA=null; const money=n=>(Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:0}); const pct=n=>Number.isFinite(+n)?(+n).toFixed(2):'';
function cls(v){return (+v)>=0?'pos':'neg'}
function rowsToTable(el, rows, cols){ if(!rows.length){el.innerHTML='<tr><td class="muted">无数据</td></tr>';return} el.innerHTML='<thead><tr>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c[2]?c[2](r[c[0]]):''}">${c[3]?c[3](r[c[0]],r):r[c[0]]??''}</td>`).join('')+'</tr>').join('')+'</tbody>'; }
function renderChart(rows){ const el=document.getElementById('chart'); const W=760,H=280,pad=42; const vals=[]; rows.forEach(r=>{vals.push(+r['基准预测']||0,+r['人工预测销量']||0,+r['乐观预测']||0)}); const max=Math.max(...vals,1)*1.12; const xs=rows.map((r,i)=>pad+i*(W-pad*2)/Math.max(rows.length-1,1)); const y=v=>H-pad-(v/max)*(H-pad*2); function line(field,color){return `<polyline fill="none" stroke="${color}" stroke-width="3" points="${rows.map((r,i)=>xs[i]+','+y(+r[field]||0)).join(' ')}"/>`+rows.map((r,i)=>`<circle cx="${xs[i]}" cy="${y(+r[field]||0)}" r="4" fill="${color}"/>`).join('')} el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#cbd5e1"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#cbd5e1"/>${line('基准预测','#2563eb')}${line('人工预测销量','#d97706')}${line('乐观预测','#16a34a')}${rows.map((r,i)=>`<text x="${xs[i]}" y="${H-16}" text-anchor="middle" font-size="12" fill="#64748b">${r['预测月份'].slice(5)}</text><text x="${xs[i]}" y="${y(+r['基准预测'])-10}" text-anchor="middle" font-size="11" fill="#2563eb">${money(r['基准预测'])}</text>`).join('')}<g transform="translate(${W-245},18)"><rect width="225" height="30" rx="10" fill="rgba(255,255,255,.8)"/><circle cx="14" cy="15" r="4" fill="#2563eb"/><text x="24" y="19" font-size="12">基准</text><circle cx="74" cy="15" r="4" fill="#d97706"/><text x="84" y="19" font-size="12">人工</text><circle cx="144" cy="15" r="4" fill="#16a34a"/><text x="154" y="19" font-size="12">乐观</text></g></svg>` }
function render(){ const model=document.getElementById('model').value, mon=document.getElementById('month').value, q=document.getElementById('q').value.trim().toLowerCase(); const mo=DATA.month_overview.filter(r=>r['预测类型']===model); const showMo=mon==='全部'?mo:mo.filter(r=>r['预测月份']===mon); const total=showMo.reduce((a,r)=>{['保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(k=>a[k]=(a[k]||0)+(+r[k]||0)); return a},{}); document.getElementById('kpis').innerHTML=[['SKU数',DATA.meta.sku_count,'A/B/C/D 定级SKU'],['基准预测',money(total['基准预测']),'当前筛选合计'],['人工预测',money(total['人工预测销量']),'最新补货模型'],['基准-人工',money(total['基准-人工']),(total['基准-人工']||0)>=0?'高于人工':'低于人工'],['预测周期','7-12月',DATA.meta.grain]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="val">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join(''); renderChart(mo); rowsToTable(document.getElementById('monthTable'),mo,[['预测月份','月份'],['保守预测','保守',null,money],['基准预测','基准',null,money],['乐观预测','乐观',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]); const pos=DATA.position_summary.filter(r=>r['预测类型']===model && (mon==='全部'||r['预测月份']===mon)); rowsToTable(document.getElementById('posTable'),pos,[['产品定位','定位'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]); let cats=DATA.category_summary.filter(r=>r['预测类型']===model && (mon==='全部'||r['预测月份']===mon)); if(q) cats=cats.filter(r=>String(r['三级类目']).toLowerCase().includes(q)); cats=cats.sort((a,b)=>(+b['基准预测']||0)-(+a['基准预测']||0)).slice(0,30); rowsToTable(document.getElementById('catTable'),cats,[['三级类目','三级类目'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]); let owners=DATA.ops_owner_summary.filter(r=>r['预测类型']===model && (mon==='全部'||r['预测月份']===mon)); if(q) owners=owners.filter(r=>String(r['负责人（运营）']).toLowerCase().includes(q)); owners=owners.sort((a,b)=>(+b['基准预测']||0)-(+a['基准预测']||0)).slice(0,30); rowsToTable(document.getElementById('ownerTable'),owners,[['负责人（运营）','运营负责人'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]); let rev=DATA.review_top; if(mon!=='全部') rev=rev.filter(r=>r['预测月份']===mon); if(q) rev=rev.filter(r=>['SKU','产品名称','三级类目','负责人（运营）','负责人（计划）'].some(k=>String(r[k]||'').toLowerCase().includes(q))); rowsToTable(document.getElementById('reviewTable'),rev.slice(0,60),[['预测月份','月份'],['SKU','SKU'],['产品名称','产品名称'],['三级类目','类目'],['负责人（运营）','运营'],['产品定位','定位'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money],['差异率','差异率',cls,v=>(+v*100).toFixed(1)+'%'],['复核标签','标签',null,v=>`<span class="pill danger">${v}</span>`]]); document.getElementById('src').innerHTML=`<b>数据源：</b>${DATA.source_file}<br><b>生成时间：</b>${DATA.generated_at}｜<b>源文件更新时间：</b>${DATA.meta.source_mtime}｜<b>口径：</b>${DATA.meta.forecast_object}，${DATA.meta.forecast_period}，${DATA.meta.grain}` }
fetch('forecast_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d; const months=[...new Set(d.month_overview.map(r=>r['预测月份']))]; document.getElementById('month').innerHTML='<option value="全部">全部月份</option>'+months.map(m=>`<option>${m}</option>`).join(''); ['model','month','q'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render)); render();});
</script></body></html>
