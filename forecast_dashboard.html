<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>需求预测｜7-12月预测</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--line:#dbe3ee;--text:#122033;--muted:#6b7788;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 12px 32px rgba(15,23,42,.10)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#f8fbff,#eef4fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.wrap{padding:22px 26px 34px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.title h1{font-size:26px;margin:0 0 8px;font-weight:900;letter-spacing:-.02em}.title p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#ecfeff;border:1px solid #a5f3fc;color:#0e7490;font-weight:800;font-size:13px;white-space:nowrap}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(150px,1fr));margin-bottom:14px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.kpi .label{color:var(--muted);font-size:13px;margin-bottom:8px}.kpi .val{font-size:25px;font-weight:900}.kpi .sub{color:var(--muted);font-size:12px;margin-top:6px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;min-width:150px}.two{grid-template-columns:1.4fr .9fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:17px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #edf1f7;padding:9px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:#475569;background:#f8fafc;font-weight:800;position:sticky;top:0}.scroll{max-height:360px;overflow:auto}.chart{height:300px}.bar{height:10px;background:#e8eef7;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:999px}.neg{color:var(--red)}.pos{color:var(--green)}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.8}.src{font-size:12px;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:12px;margin-top:14px;word-break:break-all}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.danger{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857}@media(max-width:1000px){.kpis,.two,.three{grid-template-columns:1fr}.hero{display:block}.badge{margin-top:12px}}
</style></head><body><div class="wrap">
  <section class="hero"><div class="title"><h1>需求预测｜7-12月预测分析</h1><p>数据来自 04_需求计划 最新预测文件；展示基础预测、LightGBM、CatBoost 与最新人工预测对比。人工预测只作复核参考，不反推模型。</p></div><div class="badge">📈 标签修正版｜三线标签不重叠｜固定看板模块</div></section>
  <section class="grid kpis" id="kpis"></section>
  <section class="filters"><select id="model"><option>基础预测</option><option>LightGBM</option><option>CatBoost</option></select><select id="month"><option value="全部">全部月份</option></select><select id="series"><option value="全部">全部系列</option></select><select id="category"><option value="全部">全部三级类目</option></select><input id="q" placeholder="搜索类目 / 负责人 / SKU / 系列"/></section>
  <section class="grid two"><div class="card"><h2>月度预测趋势</h2><div id="chart" class="chart"></div></div><div class="card"><h2>月度总览</h2><div class="scroll"><table id="monthTable"></table></div></div></section>
  <section class="grid three" style="margin-top:14px"><div class="card"><h2>产品定位汇总</h2><div class="scroll"><table id="posTable"></table></div></div><div class="card"><h2>三级类目 TOP</h2><div class="scroll"><table id="catTable"></table></div></div><div class="card"><h2>负责人 TOP</h2><div class="scroll"><table id="ownerTable"></table></div></div></section>
  <section class="card" style="margin-top:14px"><h2>SKU维度预测明细</h2><div class="note">按 SKU 聚合当前筛选范围内的历史6个月实销、保守、基准、乐观和人工预测，默认按基准预测降序展示。</div><div class="scroll"><table id="skuTable"></table></div></section>
  <section class="card" style="margin-top:14px"><h2>人工差异与低置信复核清单 TOP</h2><div class="note">优先看差异绝对值大、人工差异超过30%、人工缺失但基础有量的 SKU。</div><div class="scroll"><table id="reviewTable"></table></div></section>
  <section class="src" id="src"></section>
</div>
<script>
let DATA=null; const money=n=>(Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:0}); const pct=n=>Number.isFinite(+n)?(+n).toFixed(2):'';
function cls(v){return (+v)>=0?'pos':'neg'}
function rowsToTable(el, rows, cols){ if(!rows.length){el.innerHTML='<tr><td class="muted">无数据</td></tr>';return} el.innerHTML='<thead><tr>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td class="${c[2]?c[2](r[c[0]]):''}">${c[3]?c[3](r[c[0]],r):r[c[0]]??''}</td>`).join('')+'</tr>').join('')+'</tbody>'; }
function renderChart(rows){
  const el=document.getElementById('chart');
  const W=820,H=330,padL=50,padR=36,padT=54,padB=42;
  const vals=[]; rows.forEach(r=>{vals.push(+r['基准预测']||0,+r['人工预测销量']||0,+r['乐观预测']||0)});
  const max=Math.max(...vals,1)*1.16;
  const xs=rows.map((r,i)=>padL+i*(W-padL-padR)/Math.max(rows.length-1,1));
  const y=v=>H-padB-(v/max)*(H-padT-padB);
  const series=[
    {field:'基准预测',name:'基准',color:'#2563eb',dx:-2},
    {field:'人工预测销量',name:'人工',color:'#d97706',dx:0},
    {field:'乐观预测',name:'乐观',color:'#16a34a',dx:2}
  ];
  function line(s){return `<polyline fill="none" stroke="${s.color}" stroke-width="3" points="${rows.map((r,i)=>xs[i]+','+y(+r[s.field]||0)).join(' ')}"/>`+rows.map((r,i)=>`<circle cx="${xs[i]}" cy="${y(+r[s.field]||0)}" r="4" fill="${s.color}"/>`).join('')}
  function labels(){
    let out='';
    rows.forEach((r,i)=>{
      let items=series.map(s=>({s,val:+r[s.field]||0,x:xs[i]+s.dx,y:y(+r[s.field]||0)-10})).sort((a,b)=>a.y-b.y);
      const gap=15, top=18, bottom=H-padB-16;
      for(let j=1;j<items.length;j++){ if(items[j].y-items[j-1].y<gap) items[j].y=items[j-1].y+gap; }
      const overflow=items[items.length-1].y-bottom;
      if(overflow>0){ items.forEach(it=>it.y-=overflow); }
      for(let j=items.length-2;j>=0;j--){ if(items[j+1].y-items[j].y<gap) items[j].y=items[j+1].y-gap; }
      const under=top-items[0].y;
      if(under>0){ items.forEach(it=>it.y+=under); }
      items.forEach(it=>{
        const txt=money(it.val), w=Math.max(42,txt.length*7+8), tx=Math.max(padL-12,Math.min(W-padR+12,it.x));
        out+=`<rect x="${tx-w/2}" y="${it.y-11}" width="${w}" height="14" rx="4" fill="rgba(255,255,255,.82)" stroke="rgba(203,213,225,.75)"/>`;
        out+=`<text x="${tx}" y="${it.y}" text-anchor="middle" font-size="11" font-weight="700" fill="${it.s.color}">${txt}</text>`;
      });
    });
    return out;
  }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" style="overflow:visible"><line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#cbd5e1"/><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#cbd5e1"/>${series.map(line).join('')}${labels()}${rows.map((r,i)=>`<text x="${xs[i]}" y="${H-16}" text-anchor="middle" font-size="12" fill="#64748b">${r['预测月份'].slice(5)}</text>`).join('')}<g transform="translate(${W-255},16)"><rect width="236" height="32" rx="10" fill="rgba(255,255,255,.86)" stroke="rgba(203,213,225,.7)"/><circle cx="14" cy="16" r="4" fill="#2563eb"/><text x="24" y="20" font-size="12">基准</text><circle cx="82" cy="16" r="4" fill="#d97706"/><text x="92" y="20" font-size="12">人工</text><circle cx="154" cy="16" r="4" fill="#16a34a"/><text x="164" y="20" font-size="12">乐观</text></g></svg>`
}
function sumRows(rows){return rows.reduce((a,r)=>{['保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(k=>a[k]=(a[k]||0)+(+r[k]||0)); return a},{})}
function filterActualRows(model, mon, series, category, q){let arr=DATA.actual_sales_detail||[]; if(series!=='全部') arr=arr.filter(r=>(r['系列名称']||'')===series); if(category!=='全部') arr=arr.filter(r=>(r['三级类目']||'')===category); const qmatch=r=>!q||['三级类目','负责人（运营）','负责人（计划）','SKU','产品名称','系列名称'].some(k=>String(r[k]||'').toLowerCase().includes(q)); arr=arr.filter(qmatch); if(mon!=='全部') arr=[]; return arr;}
function actualMonthRows(rows){const m=new Map(); rows.forEach(r=>{const k=r['月份']; if(!m.has(k)) m.set(k,{预测月份:k,历史销量:0,保守预测:'',基准预测:'',乐观预测:'',人工预测销量:'','基准-人工':''}); m.get(k).历史销量+=(+r.qty||0);}); return [...m.values()].sort((a,b)=>String(a['预测月份']).localeCompare(String(b['预测月份']))).map(o=>{o.历史销量=Math.round(o.历史销量*100)/100; return o;});}
function groupRows(rows,key){const m=new Map(); rows.forEach(r=>{const k=r[key]||'其他'; if(!m.has(k)) m.set(k,{[key]:k,SKU集合:new Set(),保守预测:0,基准预测:0,乐观预测:0,人工预测销量:0,'基准-人工':0}); const o=m.get(k); o.SKU集合.add(r.SKU||''); ['保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(f=>o[f]+=+r[f]||0);}); return [...m.values()].map(o=>{o.SKU数=o.SKU集合.size; delete o.SKU集合; ['保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(f=>o[f]=Math.round(o[f]*100)/100); return o;});}
function skuRows(rows, actualRows){const m=new Map(); rows.forEach(r=>{const k=r.SKU||'其他'; if(!m.has(k)) m.set(k,{SKU:k,产品名称:r['产品名称']||'',系列名称:r['系列名称']||'',三级类目:r['三级类目']||'',负责人:r['负责人（运营）']||'',产品定位:r['产品定位']||'',历史6月合计:0,保守预测:0,基准预测:0,乐观预测:0,人工预测销量:0,'基准-人工':0}); const o=m.get(k); ['保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(f=>o[f]+=+r[f]||0);}); actualRows.forEach(r=>{const k=r.SKU||'其他'; if(!m.has(k)) m.set(k,{SKU:k,产品名称:r['产品名称']||'',系列名称:r['系列名称']||'',三级类目:r['三级类目']||'',负责人:r['负责人（运营）']||'',产品定位:r['产品定位']||'',历史6月合计:0,保守预测:0,基准预测:0,乐观预测:0,人工预测销量:0,'基准-人工':0}); const o=m.get(k); const mk='历史_'+r['月份']; o[mk]=(o[mk]||0)+(+r.qty||0); o.历史6月合计+=(+r.qty||0);}); return [...m.values()].map(o=>{(DATA.history_months||[]).forEach(m=>o['历史_'+m]=Math.round((o['历史_'+m]||0)*100)/100); ['历史6月合计','保守预测','基准预测','乐观预测','人工预测销量','基准-人工'].forEach(f=>o[f]=Math.round((+o[f]||0)*100)/100); return o;});}
function monthRows(rows){return groupRows(rows,'预测月份').sort((a,b)=>String(a['预测月份']).localeCompare(String(b['预测月份'])))}
function render(){
 const model=document.getElementById('model').value, mon=document.getElementById('month').value, series=document.getElementById('series').value, category=document.getElementById('category').value, q=document.getElementById('q').value.trim().toLowerCase();
 let detail=(DATA.forecast_detail||[]).filter(r=>r['预测类型']===model);
 if(series!=='全部') detail=detail.filter(r=>(r['系列名称']||'')===series);
 if(category!=='全部') detail=detail.filter(r=>(r['三级类目']||'')===category);
 const detailByMonth=mon==='全部'?detail:detail.filter(r=>r['预测月份']===mon);
 const qmatch=r=>!q||['三级类目','负责人（运营）','负责人（计划）','SKU','产品名称','系列名称'].some(k=>String(r[k]||'').toLowerCase().includes(q));
 const filtered=detailByMonth.filter(qmatch);
 const actualRows=filterActualRows(model, mon, series, category, q);
 const total=sumRows(filtered);
 const skuCount=new Set(filtered.map(r=>r.SKU).filter(Boolean)).size;
 const mo=monthRows(detail.filter(qmatch));
 document.getElementById('kpis').innerHTML=[['SKU数',skuCount||0,(series==='全部'&&category==='全部')?'当前筛选SKU':(series!=='全部'?'系列：'+series:'类目：'+category)],['基准预测',money(total['基准预测']),'当前筛选合计'],['人工预测',money(total['人工预测销量']),'最新补货模型'],['基准-人工',money(total['基准-人工']),(total['基准-人工']||0)>=0?'高于人工':'低于人工'],['历史6月销量',money(actualRows.reduce((a,r)=>a+(+r.qty||0),0)),DATA.meta.history_sales_months||'2026-01~2026-06']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="val">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('');
 renderChart(mo);
 const monthDisplay=actualMonthRows(actualRows).concat(mo);
 rowsToTable(document.getElementById('monthTable'),monthDisplay,[['预测月份','月份'],['历史销量','历史销量',null,v=>v===''?'':money(v)],['保守预测','保守',null,v=>v===''?'':money(v)],['基准预测','基准',null,v=>v===''?'':money(v)],['乐观预测','乐观',null,v=>v===''?'':money(v)],['人工预测销量','人工',null,v=>v===''?'':money(v)],['基准-人工','差异',v=>v===''?'':cls(v),v=>v===''?'':money(v)]]);
 const pos=groupRows(filtered,'产品定位').sort((a,b)=>String(a['产品定位']).localeCompare(String(b['产品定位'])));
 rowsToTable(document.getElementById('posTable'),pos,[['产品定位','定位'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]);
 const cats=groupRows(filtered,'三级类目').sort((a,b)=>(+b['基准预测']||0)-(+a['基准预测']||0)).slice(0,30);
 rowsToTable(document.getElementById('catTable'),cats,[['三级类目','三级类目'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]);
 const owners=groupRows(filtered,'负责人（运营）').sort((a,b)=>(+b['基准预测']||0)-(+a['基准预测']||0)).slice(0,30);
 rowsToTable(document.getElementById('ownerTable'),owners,[['负责人（运营）','运营负责人'],['SKU数','SKU'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]);
 const skus=skuRows(filtered,actualRows).sort((a,b)=>(+b['基准预测']||0)-(+a['基准预测']||0)).slice(0,120);
 const histCols=(DATA.history_months||[]).map(m=>['历史_'+m,m.slice(5)+'实销',null,money]);
 rowsToTable(document.getElementById('skuTable'),skus,[['SKU','SKU'],['产品名称','产品名称'],['系列名称','系列'],['三级类目','三级类目'],['负责人','运营'],['产品定位','定位'],...histCols,['历史6月合计','历史合计',null,money],['保守预测','保守',null,money],['基准预测','基准',null,money],['乐观预测','乐观',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money]]);
 let rev=(DATA.review_top||[]).filter(r=>(model==='基础预测'||r['预测类型']===model) && (mon==='全部'||r['预测月份']===mon) && (series==='全部'||(r['系列名称']||'')===series) && (category==='全部'||(r['三级类目']||'')===category) && qmatch(r));
 rowsToTable(document.getElementById('reviewTable'),rev.slice(0,60),[['预测月份','月份'],['SKU','SKU'],['产品名称','产品名称'],['系列名称','系列'],['三级类目','类目'],['负责人（运营）','运营'],['产品定位','定位'],['基准预测','基准',null,money],['人工预测销量','人工',null,money],['基准-人工','差异',cls,money],['差异率','差异率',cls,v=>(+v*100).toFixed(1)+'%'],['复核标签','标签',null,v=>`<span class="pill danger">${v}</span>`]]);
 document.getElementById('src').innerHTML=`<b>数据源：</b>${DATA.source_file}<br><b>生成时间：</b>${DATA.generated_at}｜<b>源文件更新时间：</b>${DATA.meta.source_mtime}｜<b>口径：</b>${DATA.meta.forecast_object}，${DATA.meta.forecast_period}，${DATA.meta.grain}｜<b>系列筛选：</b>${series}｜<b>三级类目：</b>${category}`
}
fetch('forecast_data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d; const months=[...new Set((d.forecast_detail||d.month_overview).map(r=>r['预测月份']))]; document.getElementById('month').innerHTML='<option value="全部">全部月份</option>'+months.map(m=>`<option>${m}</option>`).join(''); const series=d.series_list||[]; document.getElementById('series').innerHTML='<option value="全部">全部系列</option>'+series.map(x=>`<option>${x}</option>`).join(''); const categories=d.category_list||[]; document.getElementById('category').innerHTML='<option value="全部">全部三级类目</option>'+categories.map(x=>`<option>${x}</option>`).join(''); ['model','month','series','category','q'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render)); render();});
</script></body></html>
