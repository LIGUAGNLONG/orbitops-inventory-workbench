<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>销量分析｜OrbitOps</title>
<style>
:root{--bg:#f3f7fb;--panel:#fff;--ink:#182335;--muted:#667085;--line:#dde6f1;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 10px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fbff,#edf4fb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{padding:20px 22px 36px}.hero{background:linear-gradient(135deg,#11233d,#1d4ed8 55%,#06b6d4);color:white;border-radius:22px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:0 0 8px;font-size:24px}.hero p{margin:0;color:#dbeafe}.toolbar{margin-top:16px;display:grid;grid-template-columns:.68fr .92fr .92fr .92fr .82fr 1.35fr;gap:12px}.control{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:9px 10px;min-width:0}.control label{display:block;font-size:12px;color:#bfdbfe;margin-bottom:5px}.control input,.control select{width:100%;border:0;border-radius:9px;padding:8px 9px;background:white;color:#111827;font-weight:650}.multiBox{position:relative}.multiBtn{width:100%;border:0;border-radius:9px;padding:8px 9px;background:white;color:#111827;font-weight:750;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.multiMenu{display:none;position:absolute;z-index:20;left:0;top:64px;width:max(100%,240px);max-height:310px;overflow:auto;background:white;color:#111827;border:1px solid #dbe3ef;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);padding:10px}.multiMenu.right{left:auto;right:0}.multiMenu.open{display:block}.multiMenu label{color:#111827;font-size:12px;display:flex;gap:7px;align-items:center;margin:6px 0}.multiMenu input{width:auto}.metricActions{display:flex;gap:8px;border-bottom:1px solid #e5edf6;padding-bottom:8px;margin-bottom:6px}.metricActions button{border:1px solid #dbe3ef;background:#f8fafc;border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card .label{font-size:12px;color:var(--muted)}.card .value{font-size:25px;font-weight:850;margin-top:7px}.card .sub{font-size:12px;color:var(--muted);margin-top:6px}.up{color:var(--green)}.down{color:var(--red)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px}.section h2{margin:0 0 12px;font-size:17px}.chartHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.chartHead h2{margin:0}.chartMetricBox{min-width:280px;display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px}.trendSelectorLabel{font-size:12px;font-weight:800;color:#1e40af;white-space:nowrap}.chartMetricBox .multiBtn{border:1px solid #2563eb;background:#fff;color:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.16);padding:8px 30px 8px 10px;position:relative}.chartMetricBox .multiBtn:hover{background:#dbeafe}.chartMetricBox .multiMenu{top:48px;left:auto;right:0;width:270px}.chartLegend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:7px 0 10px;min-height:22px}.legendItem{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#475569}.legendDot{width:9px;height:9px;border-radius:50%;display:inline-block}.chart{width:100%;height:390px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}.reasons{display:grid;gap:10px}.metricTable{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}.metricTable th,.metricTable td{padding:8px 6px;border-bottom:1px solid #edf2f7}.metricTable th{position:static;background:#f8fafc;color:#475569}.metricTable td{text-align:right;font-variant-numeric:tabular-nums}.metricTable td:first-child,.metricTable th:first-child{text-align:left}.metricTable .delta{font-weight:850}.reason{border-left:4px solid var(--blue);background:#f8fafc;border-radius:12px;padding:10px 12px}.reason.bad{border-left-color:var(--red)}.reason.good{border-left-color:var(--green)}.reason .t{font-weight:800}.reason .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.table-wrap{margin-top:14px;overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;background:white;font-size:12px}th,td{padding:10px 9px;border-bottom:1px solid #edf2f7;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;text-align:left;color:#475569;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.analysis{min-width:310px;line-height:1.45}.tag{display:inline-block;border-radius:999px;padding:2px 7px;font-size:11px;background:#e0f2fe;color:#0369a1;margin-right:4px;margin-bottom:3px}.tag.red{background:#fee2e2;color:#991b1b}.tag.green{background:#dcfce7;color:#166534}.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.footer{margin-top:14px;color:var(--muted);font-size:12px}.full{grid-column:1 / -1}@media(max-width:1050px){.toolbar,.cards,.grid{grid-template-columns:1fr}.chart{height:260px}}
</style>
</head>
<body><div class="wrap">
  <div class="hero">
    <h1>销量分析模块</h1>
    <p>数据维度：2025年1月至最新入库日期；当前区间、对比区间和三级类目均支持多选；每个 SKU 自动生成三条增长/下降原因。</p>
    <div class="toolbar">
      <div class="control"><label>时间粒度</label><select id="grain"><option value="month">按月</option><option value="week">按周</option></select></div>
      <div class="control multiBox"><label>当前区间（多选）</label><button class="multiBtn" id="periodBtn" type="button">请选择</button><div class="multiMenu" id="periodMenu"></div></div>
      <div class="control multiBox"><label>对比区间（多选）</label><button class="multiBtn" id="compareBtn" type="button">请选择</button><div class="multiMenu" id="compareMenu"></div></div>
      <div class="control multiBox"><label>三级类目（多选）</label><button class="multiBtn" id="categoryBtn" type="button">全部三级类目</button><div class="multiMenu" id="categoryMenu"></div></div>
      <div class="control multiBox"><label>对比指标（多选）</label><button class="multiBtn" id="metricBtn" type="button">核心指标</button><div class="multiMenu right" id="metricMenu"></div></div>
      <div class="control"><label>SKU搜索/选择</label><input id="skuSearch" list="skuList" placeholder="输入 SKU / ASIN / 名称，留空看全部"/><datalist id="skuList"></datalist></div>
    </div>
  </div>
  <div class="cards">
    <div class="card"><div class="label">当前销量</div><div class="value" id="kQty">-</div><div class="sub" id="kQtySub">-</div></div>
    <div class="card"><div class="label">当前订单</div><div class="value" id="kOrders">-</div><div class="sub" id="kOrdersSub">-</div></div>
    <div class="card"><div class="label">销售额</div><div class="value" id="kAmount">-</div><div class="sub" id="kAmountSub">-</div></div>
    <div class="card"><div class="label">动销SKU</div><div class="value" id="kSku">-</div><div class="sub" id="kSkuSub">按当前筛选</div></div>
  </div>
  <div class="grid">
    <div class="section"><div class="chartHead"><h2>趋势分析</h2><div class="multiBox chartMetricBox"><span class="trendSelectorLabel">趋势指标（多选）</span><button class="multiBtn" id="trendMetricBtn" type="button">销量 + FBA可售 ▼</button><div class="multiMenu" id="trendMetricMenu"></div></div></div><div class="chartLegend" id="chartLegend"></div><svg id="chart" class="chart"></svg><div class="note">趋势指标支持多选；不同量纲按各指标独立缩放，折线标签显示原始值。FBA可售取库存报表FBA仓“可售”期末数量；可用库存取领星经营数据字段。</div></div>
    <div class="section"><h2>核心对比数据</h2><div id="metricCompare"></div><h2 style="margin-top:14px">当前筛选核心原因</h2><div id="topReasons" class="reasons"></div></div>
    <div class="section full"><h2>SKU销量对比与原因</h2><div class="table-wrap"><table><thead><tr><th>SKU</th><th>ASIN/名称</th><th>当前销量</th><th>对比销量</th><th>变化</th><th>订单/金额</th><th>三条核心原因</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="footer" id="meta"></div></div>
  </div>
</div>
<script src="sales_analysis_data.json"></script>
<script>
const DATA = window.SALES_ANALYSIS_DATA || {records:[],skus:[],meta:{}};
const SKU_INFO = new Map((DATA.skus||[]).map(s=>[s.sku,s]));
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const money=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const pct=n=>!isFinite(n)?'—':(n>=0?'+':'')+(n*100).toFixed(1)+'%';
function cls(n){return n>=0?'up':'down'}

const METRICS=[
 {k:'qty',l:'销量',t:'num'}, {k:'orders',l:'订单量',t:'num'}, {k:'amount',l:'销售额',t:'money'},
 {k:'sessions_total',l:'Sessions',t:'num'}, {k:'page_views_total',l:'Page Views',t:'num'}, {k:'cvr',l:'转化率 CVR',t:'pctVal'},
 {k:'spend',l:'广告花费',t:'money'}, {k:'acos',l:'ACoS',t:'pctVal'}, {k:'roas',l:'ROAS',t:'one'},
 {k:'ads_sales_volume_quantity',l:'广告销量',t:'num'}, {k:'nature_order_items',l:'自然订单',t:'num'}, {k:'promotion_volume',l:'促销销量',t:'num'},
 {k:'avg_price',l:'平均售价',t:'money'}, {k:'fba_available',l:'FBA可售',t:'num'}, {k:'available_inventory',l:'可用库存',t:'num'}, {k:'return_rate',l:'退货率',t:'pctVal'}
];
const TREND_METRICS=METRICS.filter(m=>['qty','sessions_total','page_views_total','cvr','spend','acos','roas','ads_sales_volume_quantity','nature_order_items','promotion_volume','avg_price','fba_available','available_inventory'].includes(m.k));
const TREND_COLORS=['#2563eb','#06b6d4','#7c3aed','#16a34a','#dc2626','#d97706','#db2777','#0891b2','#4f46e5','#65a30d','#ea580c','#475569','#0f766e'];
let selectedMetrics=['qty','orders','amount','sessions_total','page_views_total','cvr','spend','acos','roas','ads_sales_volume_quantity','nature_order_items','promotion_volume','avg_price','fba_available','available_inventory','return_rate'];
let selectedTrendMetrics=['qty','fba_available'];
let selectedCurrentPeriods=[], selectedComparePeriods=[], selectedCategories=[];
function metricVal(r,k){r=r||{};let d=r.drivers||{}; if(k==='qty')return +r.qty||0; if(k==='orders')return +r.orders||0; if(k==='amount')return +r.amount||0; if(k==='avg_price')return (+r.qty||0)?(+r.amount||0)/(+r.qty||0):0; if(k==='return_rate')return (+r.qty||0)?(+r.return_qty||0)/(+r.qty||0):(+d.return_rate||0); return +(d[k]??0)||0;}
function fmtMetric(v,t){if(t==='money')return money(v); if(t==='pctVal')return (v*100).toFixed(2)+'%'; if(t==='one')return Number(v||0).toFixed(2); return fmt(v);}
function renderCheckboxMenu(menuId,items,selected,onChange,{allowEmpty=true,allLabel='全选',clearLabel='清空'}={}){let menu=$(menuId);menu.innerHTML=`<div class="metricActions"><button type="button" data-act="all">${allLabel}</button><button type="button" data-act="clear">${clearLabel}</button></div>`+items.map(x=>`<label><input type="checkbox" value="${x.v}" ${selected.includes(x.v)?'checked':''}/> ${x.l}</label>`).join('');menu.querySelectorAll('input').forEach(x=>x.addEventListener('change',()=>{let vals=[...menu.querySelectorAll('input:checked')].map(i=>i.value);if(!allowEmpty&&!vals.length){x.checked=true;return}onChange(vals)}));menu.querySelector('[data-act="all"]').onclick=()=>onChange(items.map(x=>x.v));menu.querySelector('[data-act="clear"]').onclick=()=>{if(allowEmpty)onChange([])};}
function renderMetricMenu(){renderCheckboxMenu('metricMenu',METRICS.map(m=>({v:m.k,l:m.l})),selectedMetrics,vals=>{selectedMetrics=vals;renderMetricMenu();updateMetricBtn();apply()},{allowEmpty:true});}
function updateMetricBtn(){let btn=$('metricBtn'); btn.textContent=selectedMetrics.length?`已选 ${selectedMetrics.length} 项`:'请选择指标';}
function renderTrendMetricMenu(){renderCheckboxMenu('trendMetricMenu',TREND_METRICS.map(m=>({v:m.k,l:m.l})),selectedTrendMetrics,vals=>{selectedTrendMetrics=vals;renderTrendMetricMenu();updateTrendMetricBtn();drawChart()},{allowEmpty:true});}
function updateTrendMetricBtn(){let labels=selectedTrendMetrics.map(k=>(TREND_METRICS.find(m=>m.k===k)||{}).l).filter(Boolean);$('trendMetricBtn').textContent=(labels.length?(labels.length<=2?labels.join(' + '):`已选 ${labels.length} 项`):'请选择指标')+' ▼';}
function hasMetric(r,k){if(k==='qty'||k==='orders'||k==='amount'||k==='avg_price')return true;return r&&r.drivers&&Object.prototype.hasOwnProperty.call(r.drivers,k)}
function trendAgg(rows,k){let valid=rows.filter(r=>hasMetric(r,k));if(!valid.length)return null;if(k==='qty'||k==='orders'||k==='amount'||k==='spend'||k==='sessions_total'||k==='page_views_total'||k==='ads_sales_volume_quantity'||k==='nature_order_items'||k==='promotion_volume'||k==='fba_available'||k==='available_inventory')return valid.reduce((s,r)=>s+metricVal(r,k),0);if(k==='avg_price'){let q=valid.reduce((s,r)=>s+(+r.qty||0),0),a=valid.reduce((s,r)=>s+(+r.amount||0),0);return q?a/q:0}if(k==='cvr'){let w=valid.reduce((s,r)=>s+(+(r.drivers||{}).sessions_total||0),0);return w?valid.reduce((s,r)=>s+metricVal(r,k)*(+(r.drivers||{}).sessions_total||0),0)/w:valid.reduce((s,r)=>s+metricVal(r,k),0)/valid.length}if(k==='acos'||k==='roas'){let w=valid.reduce((s,r)=>s+(+(r.drivers||{}).spend||0),0);return w?valid.reduce((s,r)=>s+metricVal(r,k)*(+(r.drivers||{}).spend||0),0)/w:valid.reduce((s,r)=>s+metricVal(r,k),0)/valid.length}return valid.reduce((s,r)=>s+metricVal(r,k),0)/valid.length}
function selectionText(vals,emptyText){if(!vals.length)return emptyText;if(vals.length===1)return vals[0];return `已选 ${vals.length} 项`;}
function updateFilterBtns(){$('periodBtn').textContent=selectionText(selectedCurrentPeriods,'请选择');$('compareBtn').textContent=selectionText(selectedComparePeriods,'请选择');$('categoryBtn').textContent=selectionText(selectedCategories,'全部三级类目');}
function renderPeriodMenus(){let ps=periods($('grain').value),items=ps.map(p=>({v:p,l:p}));renderCheckboxMenu('periodMenu',items,selectedCurrentPeriods,vals=>{selectedCurrentPeriods=vals;renderPeriodMenus();updateFilterBtns();apply()},{allowEmpty:true});renderCheckboxMenu('compareMenu',items,selectedComparePeriods,vals=>{selectedComparePeriods=vals;renderPeriodMenus();updateFilterBtns();apply()},{allowEmpty:true});}
function renderCategoryMenu(){let cats=[...new Set((DATA.skus||[]).map(s=>s.category||'未分类'))].sort((a,b)=>a.localeCompare(b,'zh-CN'));renderCheckboxMenu('categoryMenu',cats.map(c=>({v:c,l:c})),selectedCategories,vals=>{selectedCategories=vals;renderCategoryMenu();updateFilterBtns();apply()},{allowEmpty:true,allLabel:'全部',clearLabel:'清空'});}
function renderMetricCompare(cur,cmp){let html='<table class="metricTable"><thead><tr><th>指标</th><th>当前</th><th>对比</th><th>增量</th><th>变化</th></tr></thead><tbody>'; for(const m of METRICS.filter(x=>selectedMetrics.includes(x.k))){let a=metricVal(cur,m.k),b=metricVal(cmp,m.k),d=a-b,r=b?d/b:(a?1:0); html+=`<tr><td>${m.l}</td><td>${fmtMetric(a,m.t)}</td><td>${fmtMetric(b,m.t)}</td><td class="delta ${cls(d)}">${m.t==='pctVal'?(d*100).toFixed(2)+'pp':fmtMetric(d,m.t)}</td><td class="${cls(d)}">${pct(r)}</td></tr>`;} html+='</tbody></table><div class="note">指标可在上方“对比指标”多选；月维度经营指标来自领星产品表现全量数据，按当前筛选与对比区间同步汇总。</div>'; $('metricCompare').innerHTML=html;}

function periods(grain){return [...new Set(DATA.records.filter(r=>r.period_type===grain).map(r=>r.period))].sort()}
function prevPeriod(p,grain){let ps=periods(grain),i=ps.indexOf(p);return i>0?ps[i-1]:null}
function yoyPeriod(p,grain){if(grain==='month'){let [y,m]=p.split('-').map(Number);return (y-1)+'-'+String(m).padStart(2,'0')} let d=new Date(p+'T00:00:00'); d.setDate(d.getDate()-364); return d.toISOString().slice(0,10)}
function getSkuText(){return $('skuSearch').value.trim().toLowerCase()}
function matchSku(r){let q=getSkuText(),info=SKU_INFO.get(r.sku)||{};if(selectedCategories.length&&!selectedCategories.includes(info.category||'未分类'))return false;if(!q)return true;return [r.sku,info.asin,info.product_name,info.category].join(' ').toLowerCase().includes(q)}
function rowsFor(selected,grain){let chosen=new Set(selected);return DATA.records.filter(r=>r.period_type===grain&&chosen.has(r.period)&&matchSku(r))}
function agg(rows){let a=rows.reduce((x,r)=>{x.qty+=+r.qty||0;x.orders+=+r.orders||0;x.amount+=+r.amount||0;x.return_qty+=+r.return_qty||0;x.cancel_qty+=+r.cancel_qty||0;x.stockout_days+=+r.stockout_days||0;if((+r.qty||0)>0)x.skus.add(r.sku);return x},{qty:0,orders:0,amount:0,return_qty:0,cancel_qty:0,stockout_days:0,skus:new Set(),drivers:{}});for(const m of METRICS){if(['qty','orders','amount','avg_price','return_rate'].includes(m.k))continue;let v=trendAgg(rows,m.k);if(v!==null)a.drivers[m.k]=v}return a}
function skuMap(rows){let groups=new Map();rows.forEach(r=>{if(!groups.has(r.sku))groups.set(r.sku,[]);groups.get(r.sku).push(r)});let out=new Map();for(const [sku,items] of groups){let a=agg(items);a.sku=sku;out.set(sku,a)}return out}
function reasonList(cur,cmp){let cq=+((cur&&cur.qty)||0), pq=+((cmp&&cmp.qty)||0), co=+((cur&&cur.orders)||0), po=+((cmp&&cmp.orders)||0), ca=+((cur&&cur.amount)||0), pa=+((cmp&&cmp.amount)||0);
 let dq=cq-pq, dp=pq?dq/pq:(cq>0?1:0), arCur=cq?ca/cq:0, arPrev=pq?pa/pq:0, odCur=co&&cq?cq/co:0, odPrev=po&&pq?pq/po:0;
 let arr=[];
 if(dq>=0){
   arr.push(['green','销量增长',`销量 ${fmt(pq)} → ${fmt(cq)}，增加 ${fmt(dq)}，变化 ${pct(dp)}。`]);
   if(co>po) arr.push(['green','订单拉动',`订单 ${fmt(po)} → ${fmt(co)}，说明需求端或转化承接增强。`]); else arr.push(['red','订单未同步放大',`销量增长但订单未明显增加，需检查批量单/B2B/口径。`]);
   if(arCur>=arPrev) arr.push(['green','客单/价格稳定',`单件金额 ${money(arPrev)} → ${money(arCur)}，价格承接未拖累增长。`]); else arr.push(['red','价格让利换量',`单件金额 ${money(arPrev)} → ${money(arCur)}，增长中含降价/折扣因素。`]);
   if((cur.stockout_days||0)<(cmp.stockout_days||0)) arr.push(['green','缺货压制减少',`缺货天数下降，销量承接能力改善。`]);
 }else{
   arr.push(['red','销量下降',`销量 ${fmt(pq)} → ${fmt(cq)}，减少 ${fmt(-dq)}，变化 ${pct(dp)}。`]);
   if(co<po) arr.push(['red','订单减少',`订单 ${fmt(po)} → ${fmt(co)}，需求/流量/转化端走弱。`]); else arr.push(['red','单均件数下降',`订单未同步下降但销量下降，可能是套装/批量单减少。`]);
   if(arCur<arPrev) arr.push(['red','金额承接变弱',`单件金额 ${money(arPrev)} → ${money(arCur)}，价格或折扣承压。`]); else arr.push(['green','价格未明显拖累',`单件金额 ${money(arPrev)} → ${money(arCur)}，下降主因更可能在流量/订单。`]);
   if((cur.stockout_days||0)>(cmp.stockout_days||0)) arr.push(['red','疑似缺货影响',`缺货天数增加，需核对FBA/海外仓可售。`]);
 }
 return arr.slice(0,3);
}
function fillControls(){let dl=$('skuList');dl.innerHTML=DATA.skus.slice(0,2500).map(s=>`<option value="${s.sku}">${s.asin||''} ${s.product_name||''}</option>`).join('');let ps=periods($('grain').value),latest=ps[ps.length-1];selectedCurrentPeriods=latest?[latest]:[];selectedComparePeriods=latest&&ps.length>1?[ps[ps.length-2]]:[];renderPeriodMenus();renderCategoryMenu();updateFilterBtns();}
function drawChart(){
 let grain=$('grain').value,selected=new Set(selectedCurrentPeriods),ps=periods(grain).slice(grain==='month'?-18:-24),w=900,h=390,padL=42,padR=24,padT=34,padB=42,svg=$('chart');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 let metas=selectedTrendMetrics.map(k=>TREND_METRICS.find(m=>m.k===k)).filter(Boolean),series=metas.map((m,mi)=>{let vals=ps.map(p=>trendAgg(rowsFor([p],grain),m.k)),finite=vals.filter(v=>v!==null&&isFinite(v)),lo=finite.length?Math.min(...finite):0,hi=finite.length?Math.max(...finite):1,span=hi-lo||Math.abs(hi)||1,color=TREND_COLORS[TREND_METRICS.findIndex(x=>x.k===m.k)%TREND_COLORS.length];return{m,mi,vals,lo,hi,span,color}});
 $('chartLegend').innerHTML=series.map(s=>{let latest=[...s.vals].reverse().find(v=>v!==null);return `<span class="legendItem"><i class="legendDot" style="background:${s.color}"></i>${s.m.l}${latest===undefined?'（当前粒度无数据）':`：${fmtMetric(latest,s.m.t)}`}</span>`}).join('');
 let x=i=>padL+i*(w-padL-padR)/Math.max(1,ps.length-1),grid=`<rect x="0" y="0" width="${w}" height="${h}" rx="14" fill="#f8fafc"/><g stroke="#e2e8f0">${[0,1,2,3,4].map(i=>`<line x1="${padL}" x2="${w-padR}" y1="${padT+i*(h-padT-padB)/4}" y2="${padT+i*(h-padT-padB)/4}"/>`).join('')}</g>`;
 let marks=series.map(s=>{let pts=s.vals.map((v,i)=>v===null?null:[x(i),padT+(s.hi-v)/s.span*(h-padT-padB)]),segments=[],current=[];pts.forEach(p=>{if(p)current.push(p);else if(current.length){segments.push(current);current=[]}});if(current.length)segments.push(current);let paths=segments.map(seg=>`<path d="${seg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>`).join('');let dots=pts.map((p,i)=>{if(!p)return'';let yy=Math.max(13,Math.min(h-padB-8,p[1]-9+((s.mi%5)-2)*10)),val=fmtMetric(s.vals[i],s.m.t);return `<circle cx="${p[0]}" cy="${p[1]}" r="${selected.has(ps[i])?5.5:3.6}" fill="${s.color}" stroke="${selected.has(ps[i])?'#111827':'#fff'}" stroke-width="${selected.has(ps[i])?1.8:1.2}"><title>${s.m.l} ${ps[i]}：${val}</title></circle><text x="${p[0]}" y="${yy}" text-anchor="middle" font-size="9" font-weight="650" fill="${s.color}" style="paint-order:stroke;stroke:#f8fafc;stroke-width:3px">${val}</text>`}).join('');return paths+dots}).join('');
 let axes=ps.map((p,i)=>`<text x="${x(i)}" y="${h-14}" text-anchor="middle" font-size="10" fill="#64748b">${grain==='month'?p.slice(2):p.slice(5)}</text>`).join('');svg.innerHTML=grid+marks+axes;
}
function apply(){
 let grain=$('grain').value,cur=rowsFor(selectedCurrentPeriods,grain),cmp=rowsFor(selectedComparePeriods,grain),A=agg(cur),B=agg(cmp),d=A.qty-B.qty,r=B.qty?d/B.qty:(A.qty?1:0);
 let currentLabel=selectedCurrentPeriods.join('、')||'无',compareLabel=selectedComparePeriods.join('、')||'无';
 $('kQty').textContent=fmt(A.qty);$('kQtySub').innerHTML=`对比 ${compareLabel}：<span class="${cls(d)}">${fmt(d)} / ${pct(r)}</span>`;
 $('kOrders').textContent=fmt(A.orders);$('kOrdersSub').innerHTML=`对比订单：<span class="${cls(A.orders-B.orders)}">${fmt(A.orders-B.orders)}</span>`;
 $('kAmount').textContent=money(A.amount);$('kAmountSub').innerHTML=`对比金额：<span class="${cls(A.amount-B.amount)}">${money(A.amount-B.amount)}</span>`;
 $('kSku').textContent=fmt(A.skus.size);
 renderMetricCompare(A,B);
 let currentMap=skuMap(cur),compareMap=skuMap(cmp),skuKeys=new Set([...currentMap.keys(),...compareMap.keys()]);
 let rows=[...skuKeys].map(sku=>{let x=currentMap.get(sku)||{sku,qty:0,orders:0,amount:0,return_qty:0,stockout_days:0,drivers:{}},y=compareMap.get(sku)||{sku,qty:0,orders:0,amount:0,return_qty:0,stockout_days:0,drivers:{}},delta=(+x.qty||0)-(+y.qty||0);return{x,y,delta,rate:y.qty?delta/y.qty:(x.qty?1:0)}}).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
 $('topReasons').innerHTML=reasonList({qty:A.qty,orders:A.orders,amount:A.amount,stockout_days:A.stockout_days},{qty:B.qty,orders:B.orders,amount:B.amount,stockout_days:B.stockout_days}).map(x=>`<div class="reason ${x[0]==='red'?'bad':'good'}"><div class="t">${x[1]}</div><div class="d">${x[2]}</div></div>`).join('');
 $('tbody').innerHTML=rows.slice(0,500).map(o=>{let r=o.x,y=o.y||{},info=SKU_INFO.get(r.sku)||{},tags=reasonList(r,y).map(z=>`<span class="tag ${z[0]==='red'?'red':'green'}">${z[1]}</span><br><span>${z[2]}</span>`).join('<br>'),metricChips=METRICS.filter(m=>selectedMetrics.includes(m.k)).slice(0,6).map(m=>`<span class="tag">${m.l}: ${fmtMetric(metricVal(r,m.k),m.t)}</span>`).join('');return `<tr><td><b>${r.sku}</b><br><span class="tag">${info.category||'未分类'}</span></td><td>${info.asin||''}<br><span style="color:#667085">${info.product_name||''}</span></td><td class="num"><b>${fmt(r.qty)}</b></td><td class="num">${fmt(y.qty||0)}</td><td class="num"><span class="${cls(o.delta)}"><b>${fmt(o.delta)}</b><br>${pct(o.rate)}</span></td><td class="num">订单 ${fmt(r.orders)}<br>金额 ${money(r.amount)}<br>${metricChips}</td><td class="analysis">${tags}</td></tr>`}).join('');
 $('meta').textContent=`当前区间 ${currentLabel}，对比区间 ${compareLabel}；三级类目 ${selectedCategories.join('、')||'全部'}；数据最新日期 ${DATA.meta.latest_date}；本页最多展示500行，按销量变化绝对值排序。`;
 drawChart();
}
function bindMenu(btnId,menuId){$(btnId).addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.multiMenu.open').forEach(m=>{if(m.id!==menuId)m.classList.remove('open')});$(menuId).classList.toggle('open')});$(menuId).addEventListener('click',e=>e.stopPropagation());}
['period','compare','category','metric','trendMetric'].forEach(x=>bindMenu(x+'Btn',x+'Menu'));document.addEventListener('click',()=>document.querySelectorAll('.multiMenu.open').forEach(m=>m.classList.remove('open')));
renderMetricMenu();updateMetricBtn();renderTrendMetricMenu();updateTrendMetricBtn();$('grain').addEventListener('change',()=>{fillControls();apply()});$('skuSearch').addEventListener('input',apply);fillControls();apply();
</script></body></html>
