<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>物流跟踪｜OrbitOps</title>
<style>
:root{--bg:#f3f7fb;--panel:#fff;--ink:#182335;--muted:#667085;--line:#dbe5f0;--blue:#2563eb;--cyan:#06b6d4;--green:#16a34a;--amber:#d97706;--red:#dc2626;--shadow:0 12px 30px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fbff,#edf4fb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{padding:20px 22px 36px}.hero{background:linear-gradient(135deg,#10233e,#1d4ed8 56%,#06b6d4);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#dbeafe}.toolbar{display:grid;grid-template-columns:.8fr .85fr 1fr 1fr 1fr 1fr;gap:10px;margin-top:16px}.control{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:13px;padding:9px}.control label{display:block;font-size:12px;color:#bfdbfe;margin-bottom:5px}.control select{width:100%;border:0;border-radius:9px;padding:8px 9px;background:#fff;color:#111827;font-weight:650}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:16px}.label{color:var(--muted);font-size:13px}.value{font-size:29px;font-weight:850;margin:7px 0 3px}.sub{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:14px}.section{padding:17px;min-width:0}.section.full{grid-column:1/-1}.section h2{font-size:17px;margin:0 0 13px}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}.legend span{font-size:12px;color:#475569;display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.chart{width:100%;height:360px;display:block}.table-wrap{overflow:auto;max-height:560px;border:1px solid #e5edf6;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{padding:10px 11px;border-bottom:1px solid #e8eef5;text-align:right}th:first-child,td:first-child{text-align:left}thead th{position:sticky;top:0;background:#eff6ff;color:#1e3a8a;z-index:2}.statusList{display:grid;gap:9px}.statusRow{border:1px solid #e6edf5;border-radius:12px;padding:11px}.statusTop{display:flex;justify-content:space-between;gap:10px;font-weight:750}.bar{height:7px;border-radius:999px;background:#eef2f7;margin:8px 0 6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px}.statusSub{font-size:12px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.65;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.toolbar{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.section.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="hero"><h1>物流跟踪看板</h1><p>按计划日期查看物流当前状态；支持月/周切换，数量口径为发货套数。</p><div class="toolbar">
<div class="control"><label>时间粒度</label><select id="grain"><option value="month">按月</option><option value="week">按周（周一）</option></select></div>
<div class="control"><label>展示范围</label><select id="range"><option value="6">近6期</option><option value="12" selected>近12期</option><option value="24">近24期</option><option value="9999">全部</option></select></div>
<div class="control"><label>当前状态</label><select id="status"></select></div>
<div class="control"><label>运营负责人</label><select id="owner"></select></div>
<div class="control"><label>物流商</label><select id="carrier"></select></div>
<div class="control"><label>店铺</label><select id="store"></select></div>
</div></div>
<div class="cards"><div class="card"><div class="label">发货套数</div><div class="value" id="kQty">-</div><div class="sub">R列发货套数</div></div><div class="card"><div class="label">计划订单</div><div class="value" id="kOrders">-</div><div class="sub">B列订单号去重</div></div><div class="card"><div class="label">发货单号</div><div class="value" id="kShipments">-</div><div class="sub">H列发货单号去重</div></div><div class="card"><div class="label">涉及SKU</div><div class="value" id="kSkus">-</div><div class="sub">N列MSKU去重</div></div></div>
<div class="grid"><div class="section"><h2 id="chartTitle">状态趋势</h2><div class="legend" id="legend"></div><svg class="chart" id="chart" viewBox="0 0 960 360"></svg><div class="note">柱体为各状态发货套数，顶部为周期总量；周口径按计划日期所在周的周一归集。</div></div><div class="section"><h2>当前状态分布</h2><div class="statusList" id="statusList"></div><div class="note">状态直接取D列“当前状态”；D列公式无缓存时，按该公式的装货、开船、到港、签收节点补算。</div></div><div class="section full"><h2 id="matrixTitle">周期 × 当前状态</h2><div class="table-wrap"><table id="matrix"></table></div><div class="note" id="meta"></div></div></div>
</div><script src="logistics_tracking_data.json?v=20260914_173039_logistics_tracking"></script><script>
const DATA=window.LOGISTICS_TRACKING_DATA||{records:[],meta:{},options:{}};const $=id=>document.getElementById(id);const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const COLORS=['#ef4444','#f59e0b','#2563eb','#06b6d4','#16a34a','#7c3aed','#64748b','#db2777','#0f766e'];const statusColor=new Map();
function fill(id,items,label){$(id).innerHTML=`<option value="">全部${label}</option>`+items.map(x=>`<option value="${String(x).replace(/"/g,'&quot;')}">${x}</option>`).join('')}
function selectedRows(){let grain=$('grain').value,filters=['status','owner','carrier','store'];let rows=DATA.records.filter(r=>filters.every(k=>!$(k).value||r[k]===$(k).value));let periods=[...new Set(rows.map(r=>r[grain]))].sort();let n=+$('range').value||12;periods=periods.slice(-n);let keep=new Set(periods);return{rows:rows.filter(r=>keep.has(r[grain])),periods,grain}}
function union(rows,key){let s=new Set();rows.forEach(r=>(r[key]||[]).forEach(x=>x&&s.add(x)));return s}
function aggregate(rows,grain){let statuses=DATA.options.statuses.filter(s=>rows.some(r=>r.status===s));let map=new Map();rows.forEach(r=>{let p=r[grain],k=p+'\u0000'+r.status;map.set(k,(map.get(k)||0)+(+r.qty||0))});return{statuses,map}}
function draw(rows,periods,grain){let {statuses,map}=aggregate(rows,grain),svg=$('chart'),w=960,h=360,L=54,R=22,T=28,B=55,totals=periods.map(p=>statuses.reduce((s,st)=>s+(map.get(p+'\u0000'+st)||0),0)),max=Math.max(1,...totals),slot=(w-L-R)/Math.max(1,periods.length),bw=Math.min(58,slot*.64);let y=v=>T+(max-v)/max*(h-T-B);let html=`<rect width="${w}" height="${h}" rx="12" fill="#f8fafc"/>`+[0,.25,.5,.75,1].map(t=>{let yy=y(max*t);return `<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" stroke="#e2e8f0"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#64748b">${fmt(max*t)}</text>`}).join('');periods.forEach((p,i)=>{let x=L+i*slot+(slot-bw)/2,base=0;statuses.forEach(st=>{let v=map.get(p+'\u0000'+st)||0,hh=v/max*(h-T-B),yy=y(base+v),c=statusColor.get(st);if(v){html+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(.6,hh)}" rx="3" fill="${c}"><title>${p}｜${st}：${fmt(v)}</title></rect>`;if(hh>18)html+=`<text x="${x+bw/2}" y="${yy+hh/2+4}" text-anchor="middle" font-size="9" font-weight="700" fill="white">${fmt(v)}</text>`}base+=v});html+=`<text x="${x+bw/2}" y="${Math.max(13,y(totals[i])-7)}" text-anchor="middle" font-size="10" font-weight="800" fill="#0f172a">${fmt(totals[i])}</text><text x="${x+bw/2}" y="${h-24}" text-anchor="middle" font-size="10" fill="#64748b">${grain==='month'?p.slice(2):p.slice(5)}</text>`});svg.innerHTML=html;$('legend').innerHTML=statuses.map(st=>`<span><i class="dot" style="background:${statusColor.get(st)}"></i>${st}</span>`).join('');$('chartTitle').textContent=(grain==='month'?'月度':'周度')+'当前状态趋势'}
function renderStatus(rows){let totals=new Map(),orders=new Map(),skus=new Map();rows.forEach(r=>{totals.set(r.status,(totals.get(r.status)||0)+(+r.qty||0));if(!orders.has(r.status))orders.set(r.status,new Set());if(!skus.has(r.status))skus.set(r.status,new Set());(r.orders||[]).forEach(x=>orders.get(r.status).add(x));(r.skus||[]).forEach(x=>skus.get(r.status).add(x))});let total=[...totals.values()].reduce((a,b)=>a+b,0);let list=[...totals].sort((a,b)=>b[1]-a[1]);$('statusList').innerHTML=list.length?list.map(([st,v])=>`<div class="statusRow"><div class="statusTop"><span>${st}</span><span>${fmt(v)} / ${total?(v/total*100).toFixed(1):'0.0'}%</span></div><div class="bar"><i style="width:${total?v/total*100:0}%;background:${statusColor.get(st)}"></i></div><div class="statusSub">订单 ${fmt(orders.get(st).size)} · SKU ${fmt(skus.get(st).size)}</div></div>`).join(''):'<div class="empty">当前筛选无数据</div>'}
function renderMatrix(rows,periods,grain){let {statuses,map}=aggregate(rows,grain),colTotals=new Map(statuses.map(s=>[s,0])),grand=0;let body=periods.map(p=>{let t=0,cells=statuses.map(st=>{let v=map.get(p+'\u0000'+st)||0;t+=v;colTotals.set(st,colTotals.get(st)+v);return`<td>${fmt(v)}</td>`}).join('');grand+=t;return`<tr><td>${p}</td>${cells}<td><b>${fmt(t)}</b></td></tr>`}).join('');let totals=statuses.map(st=>`<td><b>${fmt(colTotals.get(st))}</b></td>`).join(''),shares=statuses.map(st=>`<td>${grand?(colTotals.get(st)/grand*100).toFixed(1):'0.0'}%</td>`).join('');$('matrix').innerHTML=`<thead><tr><th>${grain==='month'?'月份':'发运周一'}</th>${statuses.map(st=>`<th style="color:${statusColor.get(st)}">${st}</th>`).join('')}<th>总计</th></tr></thead><tbody>${body}<tr><td><b>总计</b></td>${totals}<td><b>${fmt(grand)}</b></td></tr><tr><td><b>占比</b></td>${shares}<td>100%</td></tr></tbody>`;$('matrixTitle').textContent=(grain==='month'?'月份':'周')+' × 当前状态'}
function apply(){let {rows,periods,grain}=selectedRows(),qty=rows.reduce((s,r)=>s+(+r.qty||0),0),orders=union(rows,'orders'),shipments=union(rows,'shipments'),skus=union(rows,'skus');$('kQty').textContent=fmt(qty);$('kOrders').textContent=fmt(orders.size);$('kShipments').textContent=fmt(shipments.size);$('kSkus').textContent=fmt(skus.size);draw(rows,periods,grain);renderStatus(rows);renderMatrix(rows,periods,grain);$('meta').textContent=`源表：${DATA.meta.source_file}｜工作表：${DATA.meta.source_sheet}｜日期=A列计划日期｜状态=D列当前状态｜数量=R列发货套数｜有效明细 ${fmt(DATA.meta.valid_rows)} 行｜生成时间 ${DATA.meta.generated_at}`}
(DATA.options.statuses||[]).forEach((s,i)=>statusColor.set(s,COLORS[i%COLORS.length]));fill('status',DATA.options.statuses||[],'状态');fill('owner',DATA.options.owners||[],'负责人');fill('carrier',DATA.options.carriers||[],'物流商');fill('store',DATA.options.stores||[],'店铺');['grain','range','status','owner','carrier','store'].forEach(id=>$(id).addEventListener('change',apply));apply();
</script></body></html>
