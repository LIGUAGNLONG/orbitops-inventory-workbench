<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国内仓明细｜OrbitOps</title><style>:root{--bg:#f5f8fc;--card:#fff;--line:#dbe4ef;--ink:#152238;--muted:#6e7c91;--blue:#2d74df;--mint:#20b7a5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7faff,#f3f7fb);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink)}.wrap{padding:26px 30px 36px;max-width:1700px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.ey{font-size:12px;font-weight:800;letter-spacing:.09em;color:#2563eb}.head h1{font-size:27px;margin:7px 0}.sub{font-size:13px;line-height:1.7;color:var(--muted);max-width:820px}.status{font-size:12px;color:#155e75;background:#ecfeff;border:1px solid #a5f3fc;padding:8px 11px;border-radius:999px;white-space:nowrap}.filters,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 22px #0f172a0a}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px;margin:20px 0 14px}.label{font-size:12px;font-weight:800;color:#45566f}select,input{border:1px solid #cdd9e8;border-radius:9px;background:#fff;padding:9px 11px;color:#22324a;font-size:13px}.note{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--blue);padding:14px;border-radius:13px;box-shadow:0 7px 22px #0f172a09}.card:nth-child(2){border-top-color:var(--mint)}.card:nth-child(3){border-top-color:#a78bfa}.card:nth-child(4){border-top-color:#f59e0b}.ct{font-size:12px;color:var(--muted);font-weight:700}.cv{font-size:25px;font-weight:850;margin:8px 0 3px}.cs{font-size:12px;color:var(--muted)}.panel{padding:16px;margin-top:14px}.title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}.title h2{font-size:16px;margin:0}.title span{font-size:12px;color:var(--muted)}.bars{display:grid;gap:9px}.bar{display:grid;grid-template-columns:80px 1fr 150px;gap:10px;align-items:center;font-size:13px}.track{height:10px;border-radius:999px;background:#edf2f7;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2d74df,#38bdf8);border-radius:999px}.value{text-align:right;font-weight:750}.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}th,td{padding:10px 9px;border-bottom:1px solid #e8eef5;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;color:#4c5e76;z-index:1}td.num{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.wrap{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:65px 1fr 110px}.head{display:block}.status{display:inline-block;margin-top:10px}}</style></head><body><main class="wrap"><header class="head"><div><div class="ey">DOMESTIC INVENTORY DETAIL</div><h1>国内仓明细</h1><div class="sub">本地仓＝国内仓。按 <b>分类缩写</b> 汇总，库存量、总成本及不含头程成本与全链路库存看板采用同一指标维度；国内仓仅有即时在库快照，期末在途和头程成本均为 0。</div></div><div class="status" id="status">加载中…</div></header><section class="filters"><span class="label">统计指标</span><select id="metric"><option value="stock_qty">数量</option><option value="total_cost">总成本</option><option value="cost_excl_first_mile">不含头程成本</option></select><span class="label">分类缩写</span><select id="category"><option value="">全部分类</option></select><span class="label">仓库</span><select id="warehouse"><option value="">全部仓库</option></select><input id="search" placeholder="物料编码 / 名称搜索"><span class="note" id="note"></span></section><section class="cards" id="cards"></section><section class="panel"><div class="title"><h2>分类缩写库存结构</h2><span id="barhint"></span></div><div class="bars" id="bars"></div></section><section class="panel"><div class="title"><h2>国内仓明细</h2><span id="detailhint"></span></div><div class="tablewrap"><table><thead><tr><th>分类缩写</th><th>物料编码</th><th>物料名称</th><th>仓库</th><th>库存组织</th><th>库存量</th><th>可用量</th><th>采购单价</th><th>总成本</th><th>成本匹配</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);let DATA;const labels={stock_qty:'数量（主单位）',total_cost:'总成本',cost_excl_first_mile:'不含头程成本'};const n=x=>Number(x||0),qty=x=>n(x).toLocaleString('zh-CN',{maximumFractionDigits:2}),money=x=>'¥'+n(x).toLocaleString('zh-CN',{maximumFractionDigits:0});const fmt=(x,m)=>m==='stock_qty'?qty(x):money(x);function fill(id,values){$(id).insertAdjacentHTML('beforeend',values.map(x=>`<option value="${x.replaceAll('&','&amp;').replaceAll('"','&quot;')}">${x}</option>`).join(''))}function rows(){const c=$('category').value,w=$('warehouse').value,q=$('search').value.trim().toLowerCase();return DATA.records.filter(r=>(!c||r.category_abbr===c)&&(!w||r.warehouse===w)&&(!q||[r.material_code,r.material_name].join(' ').toLowerCase().includes(q)))}function apply(){const rs=rows(),m=$('metric').value;const total=rs.reduce((a,r)=>a+n(r[m]??(m==='cost_excl_first_mile'?r.total_cost:0)),0), stock=rs.reduce((a,r)=>a+n(r.stock_qty),0), available=rs.reduce((a,r)=>a+n(r.available_qty),0), cost=rs.reduce((a,r)=>a+n(r.total_cost),0);$('cards').innerHTML=[['期末在库',fmt(total,m),labels[m]],['库存量',qty(stock),'主单位'],['可用量',qty(available),'主单位'],['总成本',money(cost),'库存量 × 采购成本']].map(x=>`<article class="card"><div class="ct">${x[0]}</div><div class="cv">${x[1]}</div><div class="cs">${x[2]}</div></article>`).join('');const agg={};rs.forEach(r=>{const k=r.category_abbr;agg[k]??={v:0,q:0};agg[k].v+=n(r[m]??(m==='cost_excl_first_mile'?r.total_cost:0));agg[k].q+=n(r.stock_qty)});const a=Object.entries(agg).sort((x,y)=>y[1].v-x[1].v),max=Math.max(...a.map(x=>x[1].v),1);$('bars').innerHTML=a.length?a.map(([k,v])=>`<div class="bar"><b>${k}</b><div class="track"><div class="fill" style="width:${v.v/max*100}%"></div></div><span class="value">${fmt(v.v,m)} <small style="color:#77869a;font-weight:500">${qty(v.q)}</small></span></div>`).join(''):'<div class="empty">当前筛选无数据</div>';$('barhint').textContent=`按 ${labels[m]} 排序；末尾灰字为库存量`;$('rows').innerHTML=rs.slice().sort((a,b)=>n(b.total_cost)-n(a.total_cost)).map(r=>`<tr><td>${r.category_abbr}</td><td>${r.material_code}</td><td title="${r.material_name}">${r.material_name}</td><td>${r.warehouse}</td><td>${r.organization}</td><td class="num">${qty(r.stock_qty)}</td><td class="num">${qty(r.available_qty)}</td><td class="num">${money(r.unit_cost)}</td><td class="num">${money(r.total_cost)}</td><td>${r.cost_match}</td></tr>`).join('')||'<tr><td class="empty" colspan="10">当前筛选无数据</td></tr>';$('detailhint').textContent=`${rs.length.toLocaleString()} 行 / ${new Set(rs.map(x=>x.material_code)).size.toLocaleString()} 个物料`;$('note').textContent=`成本覆盖 ${DATA.meta.cost_coverage}% · 未匹配物料 ${DATA.meta.unmatched_codes} 个`}fetch('domestic_inventory_data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;fill('category',d.options.categories);fill('warehouse',d.options.warehouses);$('status').textContent=`快照：${d.meta.snapshot_date} · ${d.meta.generated_at}`;['metric','category','warehouse','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',apply));apply()}).catch(e=>{$('status').textContent='数据加载失败：'+e.message})</script></body></html>
