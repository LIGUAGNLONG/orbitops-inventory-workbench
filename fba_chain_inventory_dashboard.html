<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>链路库存监控｜Amazon FBA</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dce4ef;--text:#172033;--muted:#6b7788;--blue:#2563eb;--cyan:#0891b2;--green:#16a34a;--orange:#f59e0b;--purple:#7c3aed;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f8fbff,#f1f5fb 52%,#eff8ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.wrap{padding:18px 20px 30px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.head h1{font-size:23px;margin:0 0 7px}.sub{font-size:12px;color:var(--muted);line-height:1.65}.badge{display:inline-block;margin-left:8px;padding:5px 9px;border-radius:999px;background:#ecfdf5;color:#047857;border:1px solid #bbf7d0;font-size:12px}.meta{text-align:right;white-space:nowrap}
.controls{display:grid;grid-template-columns:230px 170px 170px 1fr;gap:10px;margin:14px 0}.control{height:40px;border:1px solid var(--line);border-radius:11px;background:white;padding:0 11px;color:var(--text)}.note{display:flex;align-items:center;padding:0 13px;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;color:#9a3412;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 10px 28px rgba(15,23,42,.055)}.card{padding:14px}.klabel{font-size:12px;color:var(--muted)}.kvalue{font-size:23px;font-weight:850;margin:6px 0 3px}.kdesc{font-size:11px;color:var(--muted)}.panel{padding:14px;margin-top:13px}.ptitle{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800;margin-bottom:9px}.hint{font-size:12px;color:var(--muted);font-weight:400}.charts{display:grid;grid-template-columns:1.15fr 1fr;gap:13px}.chart{width:100%;height:330px;overflow:visible}.axis{font-size:11px;fill:#64748b}.label{font-size:10px;fill:#334155;font-weight:700}.legend{display:flex;gap:12px;flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f6;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{background:#f8fafc;color:#475569;position:sticky;top:0}.tablebox{overflow:auto;max-height:380px;border:1px solid #edf1f6;border-radius:12px}.pos{color:#047857}.warn{color:#b45309}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.note{min-height:40px}}
</style></head><body><div class="wrap">
<div class="head"><div><h1>链路库存监控 <span class="badge">Amazon FBA</span></h1><div class="sub">FBA总库存 = FBA可售 + FBA预留 + 待调仓 + 标发在途 + 入库中。<br>含头程成本取五节点源成本；头程成本按 SKU 逐行计算；不含头程成本 = 含头程成本 − 头程成本。</div></div><div class="sub meta" id="meta"></div></div>
<div class="controls"><select class="control" id="version"></select><select class="control" id="metric"><option value="qty">数量维度</option><option value="cost">成本维度</option></select><select class="control" id="basis"><option value="cost_incl">含头程成本</option><option value="cost_excl">不含头程成本</option></select><div class="note" id="basisNote">数量维度下，成本口径选择不参与计算</div></div>
<div class="kpis" id="kpis"></div>
<div class="charts"><div class="panel"><div class="ptitle"><span>当前版本节点结构</span><span class="hint" id="barHint"></span></div><svg class="chart" id="barChart"></svg></div><div class="panel"><div class="ptitle"><span>版本趋势</span><span class="hint">各版本节点合计，数值逐点标注</span></div><svg class="chart" id="trendChart"></svg></div></div>
<div class="panel"><div class="ptitle"><span>版本 × 链路节点明细</span><span class="legend" id="legend"></span></div><div class="tablebox"><table id="table"></table></div></div>
</div><script>
let DATA=null; const COLORS=['#2563eb','#0891b2','#7c3aed','#f59e0b','#16a34a'];
const $=id=>document.getElementById(id), fmtNum=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0}), fmtMoney=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0}), pct=n=>(100*Number(n||0)).toFixed(1)+'%';
function add(svg,tag,a,t){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t!==undefined)e.textContent=t;svg.appendChild(e);return e}
function metricKey(){return $('metric').value==='qty'?'qty':$('basis').value} function display(v){return $('metric').value==='qty'?fmtNum(v):fmtMoney(v)}
function init(){DATA.options.versions.slice().reverse().forEach(v=>{let o=document.createElement('option');o.value=v.version;o.textContent=v.version;o.dataset.date=v.date;$('version').appendChild(o)});$('version').value=DATA.meta.latest_version;['version','metric','basis'].forEach(id=>$(id).onchange=render);$('meta').innerHTML='生成时间：'+DATA.meta.generated_at+'<br>版本数：'+DATA.options.versions.length+'｜最新：'+DATA.meta.latest_version;render()}
function current(){return DATA.nodes.filter(r=>r.version===$('version').value)}
function render(){const qty=$('metric').value==='qty';$('basis').disabled=qty;$('basisNote').textContent=qty?'数量维度下，成本口径选择不参与计算':'成本维度：'+($('basis').value==='cost_incl'?'含头程成本':'不含头程成本（已扣单位头程费用）');renderKpis();renderBar();renderTrend();renderTable()}
function renderKpis(){const rows=current(),key=metricKey(),total=rows.reduce((s,r)=>s+Number(r[key]||0),0),v=DATA.versions.find(x=>x.version===$('version').value);let html=`<div class="card"><div class="klabel">FBA总库存${$('metric').value==='qty'?'数量':'成本'}</div><div class="kvalue">${display(total)}</div><div class="kdesc">五个链路节点合计</div></div>`;rows.forEach((r,i)=>html+=`<div class="card"><div class="klabel">${r.component}</div><div class="kvalue" style="color:${COLORS[i]}">${display(r[key])}</div><div class="kdesc">占FBA总库存 ${pct(total?Number(r[key])/total:0)}</div></div>`);html+=`<div class="card"><div class="klabel">头程费用覆盖率</div><div class="kvalue">${pct(v.head_fee_coverage)}</div><div class="kdesc">按链路库存数量统计；未匹配单位头程费按0</div></div>`;$('kpis').innerHTML=html}
function renderBar(){const svg=$('barChart');svg.innerHTML='';const rows=current(),key=metricKey(),W=svg.clientWidth||680,H=330,p={l:62,r:24,t:42,b:54},cw=W-p.l-p.r,ch=H-p.t-p.b,max=Math.max(...rows.map(r=>Number(r[key])),1),step=cw/rows.length,bw=step*.56;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);add(svg,'line',{x1:p.l,y1:p.t+ch,x2:W-p.r,y2:p.t+ch,stroke:'#cbd5e1'});rows.forEach((r,i)=>{const val=Number(r[key]),h=val/max*ch,x=p.l+i*step+(step-bw)/2,y=p.t+ch-h;add(svg,'rect',{x,y,width:bw,height:Math.max(1,h),rx:8,fill:COLORS[i],opacity:.85});add(svg,'text',{x:x+bw/2,y:y-8,'text-anchor':'middle',class:'label'},display(val));add(svg,'text',{x:x+bw/2,y:H-24,'text-anchor':'middle',class:'axis'},r.component)});$('barHint').textContent=$('version').value+'｜'+($('metric').value==='qty'?'数量':$('basis').options[$('basis').selectedIndex].text)}
function renderTrend(){const svg=$('trendChart');svg.innerHTML='';const key=metricKey(),versions=DATA.options.versions,totals=versions.map(v=>DATA.nodes.filter(r=>r.version===v.version).reduce((s,r)=>s+Number(r[key]||0),0)),W=svg.clientWidth||590,H=330,p={l:52,r:28,t:46,b:62},cw=W-p.l-p.r,ch=H-p.t-p.b,min=Math.min(...totals),max=Math.max(...totals),range=(max-min)||1;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);add(svg,'line',{x1:p.l,y1:p.t+ch,x2:W-p.r,y2:p.t+ch,stroke:'#cbd5e1'});let points=[];versions.forEach((v,i)=>{const x=p.l+(versions.length===1?cw/2:i*cw/(versions.length-1)),y=p.t+ch-(totals[i]-min)/range*ch*.82-ch*.08;points.push(`${x},${y}`)});add(svg,'polyline',{points:points.join(' '),fill:'none',stroke:'#2563eb','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'});versions.forEach((v,i)=>{const [x,y]=points[i].split(',').map(Number);add(svg,'circle',{cx:x,cy:y,r:5,fill:'#fff',stroke:'#2563eb','stroke-width':3});add(svg,'text',{x,y:y-12,'text-anchor':'middle',class:'label'},display(totals[i]));add(svg,'text',{x,y:H-27,'text-anchor':'middle',class:'axis',transform:`rotate(-28 ${x} ${H-27})`},v.date.slice(5))})}
function renderTable(){const key=metricKey(),versions=DATA.options.versions.slice().reverse();let html='<thead><tr><th>版本</th><th>节点</th><th>数量</th><th>含头程成本</th><th>头程成本</th><th>不含头程成本</th><th>当前口径占比</th></tr></thead><tbody>';versions.forEach(v=>{const rows=DATA.nodes.filter(r=>r.version===v.version),total=rows.reduce((s,r)=>s+Number(r[key]||0),0);rows.forEach(r=>html+=`<tr><td>${r.version}</td><td>${r.component}</td><td>${fmtNum(r.qty)}</td><td>${fmtMoney(r.cost_incl)}</td><td>${fmtMoney(r.first_mile_cost)}</td><td>${fmtMoney(r.cost_excl)}</td><td>${pct(total?Number(r[key])/total:0)}</td></tr>`) });$('table').innerHTML=html+'</tbody>';$('legend').innerHTML=DATA.meta.components.map((x,i)=>`<span><i class="dot" style="background:${COLORS[i]}"></i>${x}</span>`).join('')}
fetch('fba_chain_inventory_data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;init()}).catch(e=>{$('meta').textContent='数据加载失败：'+e.message;console.error(e)});
</script></body></html>
