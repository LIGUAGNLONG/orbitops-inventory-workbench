<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>OrbitOps｜预测准确率</title><style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#dbe3ef;--text:#172033;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--shadow:0 12px 32px rgba(15,23,42,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fbff,#eef4ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}.wrap{padding:18px 20px 28px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.h1{font-size:24px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.5}.badge{display:inline-flex;gap:6px;align-items:center;padding:7px 10px;border-radius:999px;background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;font-size:12px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}.k{font-size:12px;color:var(--muted);font-weight:700}.v{font-size:25px;font-weight:900;margin-top:6px}.hint{font-size:12px;color:var(--muted);margin-top:5px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}.field{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 6px 18px rgba(15,23,42,.06)}label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}select,input{width:100%;border:1px solid #d8e1ef;border-radius:10px;padding:8px 9px;background:#fff;color:var(--text)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-top:12px}.panel h2{font-size:16px;margin:0 0 10px}.barrow,.barhead{display:grid;grid-template-columns:165px 1fr 74px 74px;gap:10px;align-items:center}.barrow{margin:7px 0}.barhead{margin:0 0 6px;color:var(--muted);font-size:12px;font-weight:800}.barlabel{font-size:12px;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:18px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb)}.pct{text-align:right;font-weight:800;font-size:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.tablewrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;font-size:12px;background:white}th,td{border-bottom:1px solid #edf2f7;padding:8px 9px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;z-index:1;color:#475569}tr:hover td{background:#f8fbff}.good{color:var(--green)}.mid{color:var(--amber)}.bad{color:var(--red)}.note{font-size:12px;color:var(--muted);line-height:1.65}.formula{background:#0f172a;color:#dbeafe;border-radius:14px;padding:12px;font-size:13px;line-height:1.6}.small{font-size:12px;color:var(--muted)}@media(max-width:1100px){.grid,.filters,.three{grid-template-columns:1fr}.hero{flex-direction:column}.barrow,.barhead{grid-template-columns:120px 1fr 62px 62px}}</style></head><body><div class="wrap"><div class="hero"><div><div class="h1">预测准确率</div><div class="sub" id="subtitle"></div></div><span class="badge">补货模型合并表 × 实际销量</span></div><div class="grid"><div class="card"><div class="k">当前筛选准确率</div><div class="v" id="kAcc">-</div><div class="hint">按SKU平均，不按销量加权</div></div><div class="card"><div class="k">预测SKU数</div><div class="v" id="kSku">-</div><div class="hint">产品定位不含淘汰/新品</div></div><div class="card"><div class="k">预测销量 / 实际销量</div><div class="v" id="kQty">-</div><div class="hint" id="kCompleteness">-</div></div><div class="card"><div class="k">版本数 / 月份数</div><div class="v" id="kVersion">-</div><div class="hint" id="kLatest">-</div></div></div><div class="filters"><div class="field"><label>版本</label><select id="fVersion"></select></div><div class="field"><label>月份</label><select id="fMonth"></select></div><div class="field"><label>三级类目</label><select id="fCat"></select></div><div class="field"><label>SKU / 产品名搜索</label><input id="fSearch" placeholder="输入SKU或产品名"/></div></div><div class="three"><div class="panel"><h2>每一个版本的月份准确率</h2><div id="versionBars"></div></div><div class="panel"><h2>定级×月份达成率/准确率</h2><div id="gradeBars"></div></div><div class="panel"><h2>类目级别准确率</h2><div id="catBars"></div></div></div><div class="panel"><h2>SKU级别准确率</h2><div class="tablewrap"><table id="skuTable"><thead><tr><th>版本</th><th>月份</th><th>SKU</th><th>产品名称</th><th>三级类目</th><th>产品定位</th><th>预测销量</th><th>实际销量</th><th>准确率</th><th>达成率</th><th>完整性</th></tr></thead><tbody></tbody></table></div></div><div class="panel"><h2>口径说明</h2><div class="formula" id="formula"></div><div class="note" id="notes"></div></div></div><script src="forecast_accuracy_data.json?v=20260903_094901"></script><script>
const P=window.FORECAST_ACCURACY_PAYLOAD,$=id=>document.getElementById(id),fmt=n=>(Number(n)||0).toLocaleString('zh-CN',{maximumFractionDigits:0}),hasAcc=x=>x!==null&&x!==undefined&&x!==''&&!Number.isNaN(Number(x)),pct=x=>hasAcc(x)?(Number(x)*100).toFixed(1)+'%':'未计算';function cls(x){if(!hasAcc(x))return '';x=Number(x);return x>=0.8?'good':x>=0.6?'mid':'bad'}function esc(s){return String(s??'').replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]))}function uniq(a){return[...new Set(a.filter(x=>x!==undefined&&x!==null&&String(x).trim()!==''))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN'))}function optionize(sel,vals,all){sel.innerHTML='<option value="">'+all+'</option>'+vals.map(v=>'<option>'+esc(v)+'</option>').join('')}function init(){$('subtitle').textContent=`生成时间：${P.generated_at}｜销量最新日期：${P.sales_meta.latest_sales_date}｜最新版本：${P.latest_version}`;$('formula').textContent=P.formula;$('notes').innerHTML='<ul>'+P.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>';optionize($('fVersion'),uniq(P.version_month.map(r=>r.version)),'全部版本');$('fVersion').value=P.latest_version;optionize($('fMonth'),uniq(P.version_month.map(r=>r.forecast_month)),'全部月份');optionize($('fCat'),uniq(P.category.map(r=>r.category_l3)),'全部类目');['fVersion','fMonth','fCat','fSearch'].forEach(id=>$(id).addEventListener(id==='fSearch'?'input':'change',render));render()}function filtRows(rows){const v=$('fVersion').value,m=$('fMonth').value,c=$('fCat').value,q=$('fSearch').value.trim().toUpperCase();return rows.filter(r=>(!v||r.version===v)&&(!m||r.forecast_month===m)&&(!c||r.category_l3===c)&&(!q||String(r.sku||'').toUpperCase().includes(q)||String(r.product_name||'').toUpperCase().includes(q)))}function renderBars(el,rows,labelKey,limit=18){rows=[...rows].filter(r=>hasAcc(r['准确率'])).sort((a,b)=>Number(a['准确率'])-Number(b['准确率'])).slice(0,limit);if(!rows.length){el.innerHTML='<div class="small">暂无完整月准确率</div>';return}el.innerHTML='<div class="barhead"><div></div><div></div><div class="pct">达成率</div><div class="pct">准确率</div></div>'+rows.map(r=>`<div class="barrow"><div class="barlabel" title="${esc(r[labelKey])}">${esc(r[labelKey])}</div><div class="bar"><span style="width:${Math.max(2,Math.min(100,Number(r['准确率'])*100))}%"></span></div><div class="pct">${pct(r['达成率'])}</div><div class="pct ${cls(r['准确率'])}">${pct(r['准确率'])}</div></div>`).join('')}function render(){const sku=filtRows(P.sku),accRows=sku.filter(r=>hasAcc(r['准确率'])),acc=accRows.length?accRows.reduce((s,r)=>s+Number(r['准确率']),0)/accRows.length:null,pred=sku.reduce((s,r)=>s+Number(r['预测销量']||0),0),act=sku.reduce((s,r)=>s+Number(r['实际销量']||0),0),achRows=sku.filter(r=>hasAcc(r['达成率'])),ach=achRows.length?achRows.reduce((s,r)=>s+Number(r['达成率']),0)/achRows.length:null;$('kAcc').innerHTML=`<span class="${cls(acc)}">${pct(acc)}</span>`;$('kSku').textContent=fmt(new Set(sku.map(r=>r.sku)).size);$('kQty').textContent=`${fmt(pred)} / ${fmt(act)}｜达成率 ${pct(ach)}`;$('kCompleteness').textContent=uniq(sku.map(r=>r['完整性'])).join(' / ')||'-';$('kVersion').textContent=`${P.version_count} / ${P.forecast_months.length}`;$('kLatest').textContent='当前默认最新版本';let vm=P.version_month.filter(r=>(!$('fVersion').value||r.version===$('fVersion').value)&&(!$('fMonth').value||r.forecast_month===$('fMonth').value));renderBars($('versionBars'),vm.map(r=>({...r,label:`${r.version}｜${r.forecast_month}`})),'label',24);const gradeAgg={};sku.forEach(r=>{const k=`${r.forecast_month}｜${r.product_position||'未定级'}`;gradeAgg[k]=gradeAgg[k]||{label:k,accSum:0,accN:0,achSum:0,achN:0};if(hasAcc(r['准确率'])){gradeAgg[k].accSum+=Number(r['准确率']);gradeAgg[k].accN++}if(hasAcc(r['达成率'])){gradeAgg[k].achSum+=Number(r['达成率']);gradeAgg[k].achN++}});renderBars($('gradeBars'),Object.values(gradeAgg).map(r=>({label:r.label,'准确率':r.accN?r.accSum/r.accN:null,'达成率':r.achN?r.achSum/r.achN:null})),'label',30);let cat=P.category.filter(r=>(!$('fVersion').value||r.version===$('fVersion').value)&&(!$('fMonth').value||r.forecast_month===$('fMonth').value)&&(!$('fCat').value||r.category_l3===$('fCat').value));const agg={};cat.forEach(r=>{const k=r.category_l3;agg[k]=agg[k]||{category_l3:k,accSum:0,accN:0,achSum:0,achN:0};if(hasAcc(r['准确率'])){agg[k].accSum+=Number(r['准确率']);agg[k].accN++}if(hasAcc(r['达成率'])){agg[k].achSum+=Number(r['达成率']);agg[k].achN++}});renderBars($('catBars'),Object.values(agg).map(r=>({category_l3:r.category_l3,'准确率':r.accN?r.accSum/r.accN:null,'达成率':r.achN?r.achSum/r.achN:null})),'category_l3',24);const rows=[...sku].sort((a,b)=>(hasAcc(a['准确率'])?Number(a['准确率']):9)-(hasAcc(b['准确率'])?Number(b['准确率']):9)).slice(0,500);$('skuTable').querySelector('tbody').innerHTML=rows.map(r=>`<tr><td>${esc(r.version)}</td><td>${esc(r.forecast_month)}</td><td>${esc(r.sku)}</td><td title="${esc(r.product_name)}">${esc(r.product_name)}</td><td>${esc(r.category_l3)}</td><td>${esc(r.product_position)}</td><td>${fmt(r['预测销量'])}</td><td>${fmt(r['实际销量'])}</td><td class="${cls(r['准确率'])}">${pct(r['准确率'])}</td><td>${pct(r['达成率'])}</td><td>${esc(r['完整性'])}</td></tr>`).join('')}init();
</script></body></html>
